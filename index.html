*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5}

button{font-family:inherit}

.userchip button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
main{padding-block:26px 60px}
.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:22px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.dot{width:12px;height:12px;min-width:12px;border-radius:50%;display:inline-block}

var PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
function carregaPdfJs(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  if(window._pdfjsP)return window._pdfjsP;
  window._pdfjsP=new Promise(function(ok,err){
    var sc=document.createElement('script');sc.src=PDFJS_URL;
    sc.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}catch(e){}ok(window.pdfjsLib);};
    sc.onerror=function(){err(new Error('Nao consegui carregar o leitor de PDF.'));};
    document.head.appendChild(sc);
  });
  return window._pdfjsP;
}
async function textoDoPdf(file){
  var lib=await carregaPdfJs();
  var buf=await file.arrayBuffer();
  var doc=await lib.getDocument({data:buf}).promise;
  var t='';
  for(var i=1;i<=Math.min(doc.numPages,2);i++){
    var pg=await doc.getPage(i);
    var c=await pg.getTextContent();
    t+=c.items.map(function(x){return x.str;}).join('\n')+'\n';
  }
  return t;
}

function conferirConta(txt,esperado,qual){

  var ehNosso=/fatura abrape|abrape solar - cnpj|demonstrativo de economia|ficha de compensa/i.test(tl)&&!ehConta;
  if(qual==='demo'){
    if(!ehDemo)avisos.push('O arquivo nao parece ser o <b>demonstrativo de compensacao</b> da distribuidora.');
  } else {
    if(ehDemo)avisos.push('O arquivo parece ser o <b>demonstrativo de compensacao</b>, nao a conta de energia.');
    else if(ehNosso)avisos.push('O arquivo parece ser um <b>documento da ABRAPE</b> (fatura, relatorio ou boleto), nao a conta da distribuidora.');
    else if(!ehConta)avisos.push('Nao reconheci este arquivo como uma conta de energia.');
  }
  // numero da UC / matricula
  var digArq=soDigitos(t);
  var ucEsp=soDigitos(esperado.numero_uc), matEsp=soDigitos(esperado.matricula);
  var achouUC=ucEsp&&ucEsp.length>=8&&digArq.indexOf(ucEsp)>-1;
  var achouMat=!achouUC&&matEsp&&matEsp.length>=6&&digArq.indexOf(matEsp)>-1;
  if(!achouUC&&!achouMat){
    var m=t.match(/(\d{1,3}(?:\.\d{3}){2,3}-\d{2})/);
    dados.uc=m?m[1]:null;
    avisos.push('Nao encontrei a UC <b>'+esc(esperado.numero_uc)+'</b> dentro do arquivo'+(m?'. O arquivo parece ser da UC <b>'+esc(m[1])+'</b>':'')+'.');
  } else dados.uc=esperado.numero_uc;
  // datas (Energisa: proxima | anterior | dias | atual  /  CPFL: atual | anterior | dias | Proxima leitura X)
  var m2=t.match(/(\d\d\/\d\d\/\d{4})\s*\n\s*(\d\d\/\d\d\/\d{4})\s*\n\s*(\d{1,3})\s*\n\s*(\d\d\/\d\d\/\d{4})/);
  var m3=t.match(/(\d\d\/\d\d\/\d{4})\s*\n\s*(\d\d\/\d\d\/\d{4})\s*\n\s*(\d{1,3})\s*\n\s*Pr.xima leitura\s*\n?\s*(\d\d\/\d\d\/\d{4})/i);
  if(m3){dados.atual=m3[1];dados.ant=m3[2];dados.prox=m3[4];}
  else if(m2){dados.prox=m2[1];dados.ant=m2[2];dados.atual=m2[4];}
  if(qual!=='demo'&&esperado.prox&&dados.atual){
    var esp=new Date(String(esperado.prox).slice(0,10)+'T12:00:00');
    var pa=dados.atual.split('/'); var at=new Date(pa[2]+'-'+pa[1]+'-'+pa[0]+'T12:00:00');
    var dif=Math.round((at-esp)/86400000);
    if(dif<-3)avisos.push('A leitura desta conta e <b>'+dados.atual+'</b>, anterior a leitura esperada (<b>'+dataBR(esperado.prox)+'</b>). Parece ser uma conta de mes anterior.');
    else if(dif>10)avisos.push('A leitura desta conta e <b>'+dados.atual+'</b>, bem depois da leitura esperada (<b>'+dataBR(esperado.prox)+'</b>). Confira se nao pulou um mes.');
  }
  var mr=t.match(/(Janeiro|Fevereiro|Mar.o|Abril|Maio|Junho|Julho|Agosto|Setembro|Outubro|Novembro|Dezembro)\s*\/\s*(\d{4})/i);
  if(mr)dados.ref=mr[0];
  return {avisos:avisos,dados:dados};
}

    arr.sort(function(a,b){return String(a.nome).localeCompare(String(b.nome));}).forEach(function(u){

      var gerTxt=gx?kwh(gx.kwh)+(gx.periodo_inicio?'<br><span style="font-size:11px;color:var(--muted)">'+dt(gx.periodo_inicio)+' a '+dt(gx.periodo_fim)+'</span>':''):(u.status==='OPERANDO'?'<span class="chip bad">sem leitura</span>':'&mdash;');

        var bt='';
        if(u.status!=='OPERANDO')bt='';
        else if(!u.portais||!u.portais.length)bt='<span class="chip bad" title="Cadastrar o nome desta usina no portal (RENAC SEC / AUXSOL)">sem portal</span>';

        else if(!pz)bt='<span class="chip" title="A geracao e consultada no mesmo intervalo da conta: envie a conta desta loja primeiro">aguarda a conta</span>';

        else bt='<button class="btn mini" title="Consultar a geracao nos portais entre '+dt(pz.ini)+' e '+dt(pz.fim)+'" onclick="A.grpConsultarGeracao(&quot;'+u.id+'&quot;)">Consultar '+(pz?'('+dt(pz.ini).slice(0,5)+' a '+dt(pz.fim).slice(0,5)+')':'')+'</button>';

      x+='</tr>';

  };

function hojeLocal(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
async function dadosEntrada(){
  var q=await Promise.all([
    sb.from('usinas').select('id,nome,uc_geradora_id,ativo').eq('ativo',true),
    sb.from('rateios').select('usina_id,uc_id,vigencia_fim').is('vigencia_fim',null),
    sb.from('ucs').select('id,numero_uc,apelido,matricula,tipo,proxima_leitura,proxima_leitura_estimada,ultima_leitura, clientes(nome)'),
    sb.from('documentos').select('uc_id,tipo,ref_leitura,criado_em,ciclo_id, ciclos(mes_referencia,usina_id)').in('tipo',['conta_uc_recebedora','conta_geradora']).not('uc_id','is',null),
    sb.from('ciclos').select('id,usina_id,mes_referencia,mes_geracao,mes_faturamento,status'),
    sb.from('grupos').select('id,nome').eq('ativo',true),
    sb.from('grupo_ucs').select('id,grupo_id,apelido,matricula,numero_uc,uc_id,proxima_leitura,ultima_leitura,proxima_leitura_estimada,ativo'),
    sb.from('grupo_ciclos').select('id,grupo_id,mes_referencia,status'),
    sb.from('grupo_documentos').select('grupo_uc_id,ref_leitura')
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  var us=q[0].data, ucMap={};q[2].data.forEach(function(u){ucMap[u.id]=u;});
  var ent={};
  var add=function(ucId,usina,papel){var u=ucMap[ucId];if(!u)return;var e=ent[ucId]||(ent[ucId]={uc:u,usinas:[],papel:papel});if(e.usinas.indexOf(usina)<0)e.usinas.push(usina);if(papel==='geradora')e.papel='geradora';};
  us.forEach(function(u){if(u.uc_geradora_id)add(u.uc_geradora_id,u,'geradora');});
  var ativa={};us.forEach(function(u){ativa[u.id]=u;});
  q[1].data.forEach(function(r){if(ativa[r.usina_id])add(r.uc_id,ativa[r.usina_id],'recebedora');});
  var docs=q[3].data;
  var hoje=hojeLocal();
  var lista=Object.keys(ent).map(function(k){
    var e=ent[k],u=e.uc;
    e.prox=u.proxima_leitura||null;
    e.atendida=!!(e.prox&&docs.some(function(d){return d.uc_id===k&&d.ref_leitura&&String(d.ref_leitura).slice(0,10)===String(e.prox).slice(0,10);}));
    e.vencida=!!(e.prox&&String(e.prox).slice(0,10)<=hoje&&!e.atendida);
    e.dias=e.prox?Math.round((new Date(hoje)-new Date(String(e.prox).slice(0,10)))/86400000):null;
    // ciclo de destino por usina: ciclo seguinte ao da ultima conta desta UC nesta usina
    e.alvo={};e.usinas.forEach(function(us1){
      var ult=docs.filter(function(d){return d.uc_id===k&&d.ciclos&&d.ciclos.usina_id===us1.id;}).map(function(d){return String(d.ciclos.mes_referencia).slice(0,10);}).sort().pop();
      var mes;
      if(ult){var dd=new Date(ult+'T12:00:00');dd.setMonth(dd.getMonth()+1);mes=dd.toISOString().slice(0,7)+'-01';}
      else if(e.prox){
        // o ciclo leva o nome da competencia da conta da geradora (= mes da leitura dela).
        // para uma recebedora sem historico, desconta a defasagem da usina (contas da recebedora x nome do ciclo)
        var dp=new Date(String(e.prox).slice(0,10)+'T12:00:00');
        if(e.papel!=='geradora'){
          var cl=q[4].data.filter(function(c){return c.usina_id===us1.id&&c.mes_faturamento;}).sort(function(a,b){return String(b.mes_referencia).localeCompare(String(a.mes_referencia));})[0];
          if(cl){
            var mr=new Date(String(cl.mes_referencia).slice(0,10)+'T12:00:00'), mf=new Date(String(cl.mes_faturamento).slice(0,10)+'T12:00:00');
            var lag=(mf.getFullYear()-mr.getFullYear())*12+(mf.getMonth()-mr.getMonth());
            if(lag)dp.setMonth(dp.getMonth()-lag);
          }
        }
        mes=dp.toISOString().slice(0,7)+'-01';
      }
      if(!mes){
        var cs=q[4].data.filter(function(c){return c.usina_id===us1.id;}).sort(function(a,b){return String(b.mes_referencia).localeCompare(String(a.mes_referencia));});
        var aberto=cs.filter(function(c){return c.status!=='concluido';})[0];
        if(aberto)mes=String(aberto.mes_referencia).slice(0,10);
        else if(cs[0]){var d2=new Date(String(cs[0].mes_referencia).slice(0,10)+'T12:00:00');d2.setMonth(d2.getMonth()+1);mes=d2.toISOString().slice(0,7)+'-01';}
      }
      e.alvo[us1.id]=mes;
      (e.ultCiclo=e.ultCiclo||{})[us1.id]=ult||null;
    });
    return e;
  });
  // ---- UCs de grupos (gestao de grupos) que nao sao recebedoras de usina ABRAPE ----
  var grupos={};(q[5].data||[]).forEach(function(g){grupos[g.id]=g;});
  var gdocs=q[8].data||[], gcic=q[7].data||[];
  (q[6].data||[]).forEach(function(gu){
    if(gu.ativo===false)return;
    if(gu.uc_id&&ent[gu.uc_id])return; // ja aparece pela usina ABRAPE
    var prox=gu.proxima_leitura||null;
    var atendida=!!(prox&&gdocs.some(function(d){return d.grupo_uc_id===gu.id&&d.ref_leitura&&String(d.ref_leitura).slice(0,10)===String(prox).slice(0,10);}));
    var mesAlvo=null;
    var cs=gcic.filter(function(c){return c.grupo_id===gu.grupo_id;}).sort(function(a,b){return String(b.mes_referencia).localeCompare(String(a.mes_referencia));});
    var aberto=cs.filter(function(c){return c.status!=='fechado';})[0];
    if(prox)mesAlvo=String(prox).slice(0,7)+'-01';
    else if(aberto)mesAlvo=String(aberto.mes_referencia).slice(0,10);
    lista.push({
      uc:{id:gu.id,numero_uc:gu.numero_uc||gu.matricula,apelido:gu.apelido,matricula:gu.matricula,proxima_leitura:prox,ultima_leitura:gu.ultima_leitura,proxima_leitura_estimada:gu.proxima_leitura_estimada},
      papel:'grupo', grupo:grupos[gu.grupo_id]||{id:gu.grupo_id,nome:'Grupo'}, grupo_uc_id:gu.id,
      usinas:[{id:gu.grupo_id,nome:(grupos[gu.grupo_id]||{}).nome||'Grupo',grupo:true}],
      prox:prox, atendida:atendida, vencida:!!(prox&&String(prox).slice(0,10)<=hoje&&!atendida),
      dias:prox?Math.round((new Date(hoje)-new Date(String(prox).slice(0,10)))/86400000):null,
      alvo:(function(){var o={};o[gu.grupo_id]=mesAlvo;return o;})(), ultCiclo:{}
    });
  });
  return {lista:lista,ciclos:q[4].data};
}
async function loadEntrada(){
  var d=await dadosEntrada();S.entrada=d;
  var hoje=hojeLocal();
  var em7=new Date(Date.now()+7*86400000).toISOString().slice(0,10);
  var venc=d.lista.filter(function(e){return e.vencida;}).sort(function(a,b){return String(a.prox).localeCompare(String(b.prox));});
  var prox=d.lista.filter(function(e){return e.prox&&!e.vencida&&!e.atendida&&String(e.prox).slice(0,10)>hoje&&String(e.prox).slice(0,10)<=em7;}).sort(function(a,b){return String(a.prox).localeCompare(String(b.prox));});

  var nomeUC=function(e){return (e.uc.clientes?esc(e.uc.clientes.nome):(e.papel==='geradora'?'UC geradora':e.papel==='grupo'?esc(e.grupo.nome):'UC'))+(e.uc.apelido?' <b>'+esc(e.uc.apelido)+'</b>':'')+' <span style="color:var(--muted);font-size:12px" class="mono">'+esc(e.uc.numero_uc)+'</span>';};
  var usinasTxt=function(e){return e.usinas.map(function(u){return u.grupo?'<a href="#" onclick="event.preventDefault();A.irGrupo(&quot;'+u.id+'&quot;)">'+esc(u.nome)+'</a>':'<a href="#" onclick="event.preventDefault();go(&quot;usina&quot;,&quot;'+u.id+'&quot;)">'+esc(u.nome)+'</a>';}).join('<br>');};
  var linhas=function(arr,comBotao){

      var ultTxt=e.papel==='grupo'?(e.uc.ultima_leitura?'ciclo do grupo':'&mdash;'):e.usinas.map(function(u){var c=(e.ultCiclo||{})[u.id];return c?'ciclo '+mesLbl(c):'&mdash;';}).join('<br>');
      var alvoTxt=e.usinas.map(function(u){var c=(e.alvo||{})[u.id];return c?'&rarr; ciclo '+mesLbl(c):'';}).join('<br>');
      x+='<td style="font-size:13px">'+(e.uc.ultima_leitura?'leitura '+dt(e.uc.ultima_leitura)+'<br>':'')+'<span style="color:var(--muted)">'+ultTxt+'</span></td>';
      x+='<td>'+(e.prox?'leitura '+dt(e.prox):'&mdash;')+(e.uc.proxima_leitura_estimada?' <span class="chip" title="Data estimada: ultima conta na Mesa e antiga">estimada</span>':'')+(e.vencida?' <span style="font-size:12px;color:var(--bad)">('+(e.dias===0?'hoje':'ha '+e.dias+' dia'+(e.dias===1?'':'s'))+')</span>':'')+'<br><span style="font-size:12px;color:var(--muted)">'+alvoTxt+'</span></td>';
      x+='<td style="white-space:nowrap">'+(comBotao?'<button class="btn mini" onclick="A.entradaUpload('+i+',&quot;conta&quot;)">Enviar conta</button>'+(e.papel==='geradora'?' <button class="btn sec mini" onclick="A.entradaUpload('+i+',&quot;demo&quot;)">Demonstrativo</button>':''):'<button class="btn sec mini" onclick="A.entradaUpload('+i+',&quot;conta&quot;)">Enviar antecipado</button>')+'</td></tr>';
    });
    return x+'</table></div>';
  };
  var h='<div class="pagehead"><button class="btn sec mini" onclick="go(&quot;dash&quot;)">&larr; Painel</button><h1>Caixa de entrada</h1><span class="sub">Contas de energia provavelmente disponiveis (data de leitura ja chegou)</span></div>';
  h+='<div class="panel"'+(venc.length?' style="border-color:var(--bad)"':'')+'><h2>Contas a buscar ('+venc.length+')</h2>';
  h+='<p class="note" style="margin-bottom:10px">A <b>proxima leitura</b> impressa na ultima conta de cada UC ja passou, entao a conta <b>seguinte</b> (do ciclo indicado em &quot;Conta esperada&quot;) provavelmente ja esta disponivel na distribuidora e ainda nao foi enviada. Ao enviar, o arquivo entra no ciclo da usina (ou do grupo) e na fila do Claude, e sai desta lista.</p>';
  h+=venc.length?linhas(venc,true):'<p class="empty">Nenhuma conta pendente &mdash; tudo em dia.</p>';
  h+='</div>';
  if(prox.length)h+='<div class="panel"><h2>Proximos 7 dias ('+prox.length+')</h2>'+linhas(prox,false)+'</div>';
  if(semData.length)h+='<div class="panel"><h2>Sem data de leitura ('+semData.length+')</h2><p class="note" style="margin-bottom:10px">UCs sem nenhuma conta na Mesa para ler a proxima leitura. Assim que a primeira conta for enviada, a data passa a ser controlada.</p>'+linhas(semData,true)+'</div>';
  el('main').innerHTML=h;
}

async function loadDash(){

  var hojeISO=hoje.toISOString().slice(0,10);
  var q=await Promise.all([
    sb.from('usinas').select('*').order('nome'),
    sb.from('ciclos').select('*').order('mes_referencia',{ascending:false}),
    sb.from('faturas_abrape').select('id,numero,ano,valor,vencimento,status,ciclo_id, clientes(nome), ciclos(usina_id,mes_referencia)'),
    sb.from('boletos').select('valor,status'),
    sb.from('solicitacoes').select('id,tipo,ciclo_id,usina_id,criado_em,observacoes, usinas(nome), ciclos(mes_referencia)').eq('status','pendente'),
    sb.from('rateios').select('usina_id,uc_id,vigencia_inicio,vigencia_fim,percentual, ucs(numero_uc,apelido,tipo,clientes(nome))'),
    sb.from('compensacoes').select('ciclo_id,status').in('status',['pendente','verificar']),
    sb.from('ucs').select('id,proxima_leitura'),
    sb.from('documentos').select('ciclo_id,uc_id,tipo,nome_arquivo').not('ciclo_id','is',null),
    sb.from('compensacoes').select('ciclo_id,uc_id,status'),
    sb.from('lembretes').select('*').is('resolvido_em',null).order('criado_em'),
    sb.from('documentos').select('id,nome_arquivo,tipo,ciclo_id,usina_id,uc_id,criado_em, usinas(nome), ciclos(mes_referencia)').is('enviado_em',null).in('tipo',TIPOS_ENVIO).not('ciclo_id','is',null),
    sb.from('solicitacoes').select('id,status,observacoes,criado_em,concluido_em,solicitado_por').eq('tipo','atencao').neq('status','cancelada').order('criado_em',{ascending:false}).limit(300),
    sb.from('leads').select('id,nome,email,telefone,mensagem,criado_em').eq('status','novo').order('criado_em',{ascending:false})
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  var usinas=q[0].data;S.usinas=usinas;
  var lembretes=q[10].data||[];
  S.saida=q[11].data||[];
  S.respAt={};(q[12].data||[]).forEach(function(r){try{var o=JSON.parse(r.observacoes||'{}');if(o.item_key&&!S.respAt[o.item_key]){r.o=o;S.respAt[o.item_key]=r;}}catch(e){}});
  S.saidaFila={};q[4].data.forEach(function(x){if(x.tipo==='enviar'){try{(JSON.parse(x.observacoes||'{}').documentos||[]).forEach(function(id){S.saidaFila[id]=1;});}catch(e){}}});
  var docsCiclo={};q[8].data.forEach(function(d){(docsCiclo[d.ciclo_id]=docsCiclo[d.ciclo_id]||[]).push(d);});
  var compsCiclo={};q[9].data.forEach(function(x){(compsCiclo[x.ciclo_id]=compsCiclo[x.ciclo_id]||[]).push(x);});
  var ciclos=q[1].data, faturas=q[2].data, fila=q[4].data;
  // S.dashMes = null -> painel atual (ciclo mais recente de cada usina); 'YYYY-MM-01' -> ciclos daquele mes
  var mesesDisp=[];ciclos.forEach(function(c){var m=String(c.mes_referencia).slice(0,10);if(mesesDisp.indexOf(m)<0)mesesDisp.push(m);});
  mesesDisp.sort().reverse();S.dashMesesDisp=mesesDisp;
  if(S.dashMes&&mesesDisp.indexOf(S.dashMes)<0)S.dashMes=null;
  var modoHist=!!S.dashMes;
  var latest={};ciclos.forEach(function(c){
    if(modoHist){if(String(c.mes_referencia).slice(0,10)===S.dashMes)latest[c.usina_id]=c;}
    else if(!latest[c.usina_id])latest[c.usina_id]=c;
  });
  var ucsCount={};q[5].data.forEach(function(r){if(!r.vigencia_fim)ucsCount[r.usina_id]=(ucsCount[r.usina_id]||0)+1;});
  var pendCiclo={};q[6].data.forEach(function(x){if(x.status!=='ok')pendCiclo[x.ciclo_id]=(pendCiclo[x.ciclo_id]||0)+1;});
  var atrasadas=faturas.filter(function(f){return f.status==='vencida'||(f.status==='emitida'&&f.vencimento&&f.vencimento<hojeISO);});
  var atrPorUsina={};atrasadas.forEach(function(f){
    if(!f.ciclos)return;
    if(modoHist){var lc=latest[f.ciclos.usina_id];if(!lc||lc.id!==f.ciclo_id)return;}
    atrPorUsina[f.ciclos.usina_id]=(atrPorUsina[f.ciclos.usina_id]||0)+1;
  });
  var fab=faturas.filter(function(f){return f.status==='emitida'||f.status==='vencida';});
  var vab=fab.reduce(function(a,f){return a+Number(f.valor||0);},0);
  var bven=q[3].data.filter(function(b){return b.status==='vencido'||b.status==='expirado';}).length;
  var ativas=usinas.filter(function(u){return u.ativo;});
  var conclMes=ativas.filter(function(u){var c=latest[u.id];return c&&c.status==='concluido';}).length;

  // DATA PROXIMO CICLO = proxima leitura impressa na conta da UC geradora (coletada a cada ciclo processado)
  var ucProx={};q[7].data.forEach(function(x){if(x.proxima_leitura)ucProx[x.id]=x.proxima_leitura;});
  var ucsDaUsina={};q[5].data.forEach(function(r){if(!r.vigencia_fim){(ucsDaUsina[r.usina_id]=ucsDaUsina[r.usina_id]||[]).push(r.uc_id);}});
  var dts=function(iso){var p=String(iso).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);};
  var proxInfo=function(u){
    var c=latest[u.id];
    if(modoHist)return null;
    if(c&&c.status!=='concluido')return null;
    var datas=[];
    if(u.uc_geradora_id&&ucProx[u.uc_geradora_id])datas.push(ucProx[u.uc_geradora_id]);
    else (ucsDaUsina[u.id]||[]).forEach(function(uid){if(ucProx[uid])datas.push(ucProx[uid]);});
    if(!datas.length)return null;
    datas.sort();
    var d=datas[0];
    return {d:d, overdue: d<=hojeISO};
  };
  // urgencia: 0=pendencia, 1=data do proximo ciclo chegou, 2=em andamento, 3=faturado, 4=concluido em dia, 5=sem ciclo/sem dia
  var nivel=function(u){
    var c=latest[u.id];
    // fatura em atraso NAO entra aqui: e pendencia de cobranca, aparece no menu Financeiro
    var pend=(c?(pendCiclo[c.id]||0):0);

async function loadUsina(){
  var id=S.usinaId;
  var q=await Promise.all([
    sb.from('usinas').select('*').eq('id',id).single(),
    sb.from('ciclos').select('*').eq('usina_id',id).order('mes_referencia',{ascending:false}),
    sb.from('rateios').select('*, ucs(id,numero_uc,apelido,matricula,proxima_leitura,endereco,cidade,tipo,multi_fonte,clientes(id,nome))').eq('usina_id',id),
    sb.from('condicoes_comerciais').select('*').eq('usina_id',id),
    sb.from('geracao_mensal').select('*').eq('usina_id',id).order('mes_geracao',{ascending:false}),
    sb.from('documentos').select('*, ciclos(mes_referencia)').eq('usina_id',id).order('criado_em',{ascending:false}),
    sb.from('clientes').select('id,nome').order('nome'),
    sb.from('compensacoes').select('*, ucs(numero_uc,clientes(nome)), ciclos!inner(usina_id)').eq('ciclos.usina_id',id),
    sb.from('solicitacoes').select('*').eq('usina_id',id).order('criado_em',{ascending:false}),
    sb.from('lembretes').select('*').eq('usina_id',id).is('resolvido_em',null).order('criado_em'),
    sb.from('geracao_medidores').select('*').eq('usina_id',id)
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  S.u={usina:q[0].data,ciclos:q[1].data,rateios:q[2].data,cond:q[3].data,ger:q[4].data,docs:q[5].data,comp:q[7].data,sol:q[8].data,lemb:q[9].data||[],gmed:q[10].data||[]};
  S.clientes=q[6].data;
  var fr=await sb.from('faturas_abrape').select('*, clientes(nome), ciclos!inner(usina_id,mes_referencia)').eq('ciclos.usina_id',id).order('criado_em',{ascending:false});
  if(fr.error)throw fr.error;

  if(S.u.usina.uc_geradora_id){
    var gq=await sb.from('ucs').select('*').eq('id',S.u.usina.uc_geradora_id).single();
    if(!gq.error)S.u.ger_uc=gq.data;
  }
  renderUsina();
}

function ucsDoCiclo(cs){
  var mg=String(cs.mes_geracao||cs.mes_referencia).slice(0,10);
  var vistos={};
  return (S.u.rateios||[]).filter(function(r){
    if(!r.ucs||r.ucs.tipo==='geradora')return false;
    if(r.vigencia_inicio&&String(r.vigencia_inicio).slice(0,10)>mg)return false;
    if(r.vigencia_fim&&String(r.vigencia_fim).slice(0,10)<mg)return false;
    if(vistos[r.uc_id])return false;vistos[r.uc_id]=1;return true;
  }).sort(function(a,b){return Number(b.percentual||0)-Number(a.percentual||0);});
}
function ucRot(r){var u=r.ucs||{},c=u.clientes?u.clientes.nome:'';return (u.numero_uc||'')+(u.apelido?' ('+u.apelido+')':'')+(c?' - '+c:'');}
function normTxt(t){return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function checklistCiclo(cs,cdocs,comps){
  var itens=[];
  var ger=cdocs.filter(function(d){return d.tipo==='conta_geradora'||d.tipo==='demonstrativo_energisa';});
  var demo=ger.filter(function(d){return d.tipo==='demonstrativo_energisa'||/demonstr/.test(normTxt(d.nome_arquivo));});
  var conta=ger.filter(function(d){return demo.indexOf(d)<0;});
  var gid=S.u.usina.uc_geradora_id||'';
  var auto=S.u.usina.modelo==='autoconsumo', meds=S.u.usina.medidores_internos||[];
  if(!auto){
    itens.push({rot:'UC geradora &mdash; conta Energisa',ok:conta.length>0,arq:conta.map(function(d){return d.nome_arquivo;}),uc:gid,tipo:'conta_geradora'});
    itens.push({rot:'UC geradora &mdash; demonstrativo de compensacao',ok:demo.length>0,arq:demo.map(function(d){return d.nome_arquivo;}),uc:gid,tipo:'demonstrativo_energisa'});
  }
  meds.forEach(function(m){
    var g=(S.u.gmed||[]).filter(function(x){return x.ciclo_id===cs.id&&x.medidor===m.cod;})[0];
    var ok=!!(g&&g.geracao_kwh!=null);
    itens.push({rot:'Geracao '+esc(m.nome)+' &mdash; medidor interno',ok:ok,arq:ok?[fmtN(g.geracao_kwh)+' kWh'+(g.data_leitura?' (leitura '+dt(g.data_leitura)+')':'')]:[],uc:'',tipo:'geracao:'+m.cod,med:true});
  });
  var soltas=cdocs.filter(function(d){return d.tipo==='conta_uc_recebedora'&&!d.uc_id;});
  ucsDoCiclo(cs).forEach(function(r){
    var lig=cdocs.filter(function(d){return d.tipo==='conta_uc_recebedora'&&d.uc_id===r.uc_id;});
    var num=String(r.ucs.numero_uc||'').replace(/\D/g,'');
    var nomeCli=normTxt(r.ucs.clientes?r.ucs.clientes.nome:'');
    var prov=soltas.filter(function(d){
      var n=normTxt(d.nome_arquivo),nd=n.replace(/\D/g,'');
      if(num.length>=6&&nd.indexOf(num.slice(0,7))>-1)return true;
      var base=n.replace(/\.pdf$/,'').replace(/[^a-z0-9]+/g,' ').trim();
      if(base.length>=2&&(' '+nomeCli+' ').indexOf(' '+base+' ')>-1)return true;
      var toks=base.split(' ').filter(function(t){return t.length>=4;});
      return toks.length>0&&toks.every(function(t){return nomeCli.indexOf(t)>-1;});
    });
    var cp=comps.filter(function(x){return x.uc_id===r.uc_id&&x.status==='ok';})[0];
    var ok=lig.length>0||prov.length>0||!!cp;
    var arq=lig.map(function(d){return d.nome_arquivo;}).concat(prov.map(function(d){return d.nome_arquivo+' (provavel)';}));
    if(!ok&&!arq.length&&cp)arq=['apurada'];
    itens.push({rot:'Conta da UC '+esc(ucRot(r))+(auto?'':' <span style="color:var(--muted)">('+Number(r.percentual||0)+'%)</span>'),ok:ok,arq:arq,uc:r.uc_id,tipo:'conta_uc_recebedora',apurada:!!cp&&!lig.length&&!prov.length});
  });
  var disp=cs.docs_dispensados||[];
  itens.forEach(function(i){i.chave=(i.tipo==='conta_uc_recebedora'?'uc:'+i.uc:i.tipo);i.disp=!i.ok&&disp.indexOf(i.chave)>-1;});
  var faltam=itens.filter(function(i){return !i.ok&&!i.disp;}).length;
  var h='<div class="panel" style="margin:0 0 16px;padding:14px 16px;border-color:'+(faltam?'var(--warn, #c98a1b)':'var(--ok, #2e7d4f)')+'">';
  h+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><h2 style="margin:0">Documentos do ciclo</h2>';
  var nd=itens.filter(function(i){return i.disp;}).length;
  h+=faltam?'<span class="chip warn">Faltam '+faltam+' de '+itens.length+'</span>':'<span class="chip ok">Todos recebidos ('+(itens.length-nd)+(nd?' + '+nd+' dispensado'+(nd>1?'s':''):'')+')</span>';
  h+='</div><div class="tblwrap"><table><tr><th>Documento esperado</th><th>Situacao</th><th>Arquivo</th><th></th></tr>';
  itens.forEach(function(i){
    h+='<tr><td>'+i.rot+'</td><td>'+(i.ok?'<span class="chip ok">Recebido</span>':i.disp?'<span class="chip">Dispensado</span>':'<span class="chip bad">Falta</span>')+'</td>';
    h+='<td style="word-break:break-all;color:var(--muted);font-size:12.5px">'+(i.apurada?'apurada sem arquivo vinculado':i.arq.map(esc).join('<br>'))+'</td>';
    var bt='';
    if(i.med)bt='<a href="#geracao-int" class="btn '+(i.ok?'sec ':'')+'mini" onclick="event.preventDefault();var e=document.getElementById(&quot;geracao-int&quot;);if(e)e.scrollIntoView({behavior:&quot;smooth&quot;})">'+(i.ok?'Corrigir':'Informar')+'</a>';
    else if(!i.ok&&!i.disp)bt='<button class="btn mini" onclick="A.anexarConta(&quot;'+cs.id+'&quot;,&quot;'+i.uc+'&quot;,&quot;'+i.tipo+'&quot;)">Anexar</button> <button class="btn sec mini" title="Nao sera enviado neste ciclo" onclick="A.dispensarDoc(&quot;'+cs.id+'&quot;,&quot;'+i.chave+'&quot;,true)">Dispensar</button>';
    else if(i.disp)bt='<button class="btn sec mini" onclick="A.dispensarDoc(&quot;'+cs.id+'&quot;,&quot;'+i.chave+'&quot;,false)">Desfazer</button>';
    h+='<td style="white-space:nowrap">'+bt+'</td></tr>';
  });
  h+='</table></div>';
  if(!ucsDoCiclo(cs).length)h+='<p class="note" style="margin-top:8px">Nenhuma UC recebedora com rateio vigente nesta geracao &mdash; confira a aba UCs &amp; Rateio.</p>';
  if(meds.length)h+=painelGeracaoInterna(cs,meds);
  return h+'</div>';
}
function painelGeracaoInterna(cs,meds){
  var ant=S.u.ciclos.filter(function(c){return String(c.mes_referencia)<String(cs.mes_referencia);}).sort(function(a,b){return String(b.mes_referencia).localeCompare(String(a.mes_referencia));});
  var h='<div id="geracao-int" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">';
  h+='<h2 style="margin:0 0 4px">Geracao das usinas (medidores internos)</h2>';
  h+='<p class="note" style="margin:0 0 10px">Geracao de <b>'+mesLbl(cs.mes_geracao||cs.mes_referencia)+'</b>. Digite a leitura do medidor interno de cada usina: se houver leitura anterior registrada, a geracao e calculada sozinha (atual &minus; anterior). Sem leitura acumulada, informe direto o kWh gerado no mes.</p>';
  h+='<div class="tblwrap"><table><tr><th>Usina</th><th>Leitura anterior</th><th>Data da leitura</th><th class="num">Leitura atual (kWh)</th><th class="num">Geracao no mes (kWh)</th></tr>';
  var tot=0;
  meds.forEach(function(m){
    var g=(S.u.gmed||[]).filter(function(x){return x.ciclo_id===cs.id&&x.medidor===m.cod;})[0]||{};
    var pa=null;
    for(var k=0;k<ant.length&&!pa;k++){pa=(S.u.gmed||[]).filter(function(x){return x.ciclo_id===ant[k].id&&x.medidor===m.cod;})[0]||null;}
    var antTxt=pa?(pa.leitura_kwh!=null?fmtN(pa.leitura_kwh)+' kWh':'&mdash;')+' <span style="color:var(--muted);font-size:12px">'+(pa.data_leitura?dt(pa.data_leitura):'')+(pa.geracao_kwh!=null?' &middot; gerou '+fmtN(pa.geracao_kwh):'')+'</span>':'&mdash;';
    if(g.geracao_kwh!=null)tot+=Number(g.geracao_kwh);
    var la=pa&&pa.leitura_kwh!=null?pa.leitura_kwh:'';
    h+='<tr><td><b>'+esc(m.nome)+'</b></td><td>'+antTxt+'</td>';
    h+='<td><input type="date" id="gm-dt-'+m.cod+'" value="'+(g.data_leitura?String(g.data_leitura).slice(0,10):'')+'" style="max-width:150px"></td>';
    h+='<td class="num"><input type="number" step="1" min="0" id="gm-lt-'+m.cod+'" data-ant="'+la+'" value="'+(g.leitura_kwh!=null?g.leitura_kwh:'')+'" style="max-width:130px;text-align:right" oninput="A.gmCalc(&quot;'+m.cod+'&quot;)"></td>';
    h+='<td class="num"><input type="number" step="1" min="0" id="gm-kw-'+m.cod+'" value="'+(g.geracao_kwh!=null?g.geracao_kwh:'')+'" style="max-width:130px;text-align:right"></td></tr>';
  });
  h+='</table></div>';
  h+='<div style="display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap"><button class="btn" onclick="A.salvarGeracaoInterna(&quot;'+cs.id+'&quot;)">Salvar geracao</button>';
  if(tot)h+='<span style="color:var(--muted)">Total registrado: <b>'+fmtN(tot)+' kWh</b></span>';
  h+='</div></div>';
  return h;
}

// ---------- CLIENTES ----------
async function loadClientes(){
  var q=await Promise.all([
    sb.from('clientes').select('*, ucs(id,numero_uc)').order('nome'),
    sb.from('investidores').select('*, usinas(nome)').order('nome'),
    sb.from('usinas').select('id,nome,ativo').order('nome'),
    sb.from('rateios').select('usina_id,uc_id,vigencia_fim'),
    sb.from('ucs').select('id,cliente_id')
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  S.cli=q[0].data;S.inv=q[1].data;S.usinas=q[2].data;
  var ucCli={};q[4].data.forEach(function(u){ucCli[u.id]=u.cliente_id;});
  var mapa={};
  q[3].data.forEach(function(r){
    var cid=ucCli[r.uc_id];if(!cid)return;
    if(!mapa[cid])mapa[cid]={};
    if(!mapa[cid][r.usina_id]||!r.vigencia_fim)mapa[cid][r.usina_id]=!r.vigencia_fim;
  });
  S.cliUsinas=mapa;
  renderClientes();
}
function renderClientes(){
  var h='<div class="pagehead"><h1>Clientes & Investidores</h1></div>';
  h+='<div class="tabs"><button class="'+(S.cliTab==='clientes'?'on':'')+'" onclick="A.ctab(&quot;clientes&quot;)">Clientes</button><button class="'+(S.cliTab==='inv'?'on':'')+'" onclick="A.ctab(&quot;inv&quot;)">Investidores</button></div>';
  var unome={};S.usinas.forEach(function(u){unome[u.id]=u.nome;});
  var usinasDoCliente=function(cid){
    var m=(S.cliUsinas||{})[cid]||{};
    return Object.keys(m).map(function(uid){return {id:uid,nome:unome[uid]||'?',ativa:m[uid]};})
      .sort(function(a,b){return a.nome.localeCompare(b.nome);});
  };
  if(S.cliTab==='clientes'){
    if(!S.cliUsinaFiltro)S.cliUsinaFiltro='';
    var lista=S.cli.filter(function(c){
      if(!S.cliUsinaFiltro)return true;
      return !!((S.cliUsinas||{})[c.id]||{})[S.cliUsinaFiltro];
    });
    h+='<div class="actbar"><button class="btn" onclick="A.formCliente()">Novo cliente</button>';
    h+='<div class="fld"><label>Filtrar por usina</label><select id="cli-fu" onchange="A.cliUsina(this.value)"><option value="">Todas as usinas ('+S.cli.length+')</option>';
    S.usinas.forEach(function(u){
      var n=S.cli.filter(function(c){return !!((S.cliUsinas||{})[c.id]||{})[u.id];}).length;
      if(n)h+='<option value="'+u.id+'"'+(S.cliUsinaFiltro===u.id?' selected':'')+'>'+esc(u.nome)+' ('+n+')</option>';
    });
    h+='</select></div>';
    if(S.cliUsinaFiltro)h+='<button class="btn sec" onclick="A.cliUsina(&quot;&quot;)">Limpar filtro</button>';
    h+='</div>';
    h+='<div class="panel">';
    if(!S.cli.length)h+='<p class="empty">Nenhum cliente cadastrado ainda &mdash; serao importados na migracao.</p>';
    else if(!lista.length)h+='<p class="empty">Nenhum cliente nesta usina.</p>';
    else{h+='<div class="tblwrap"><table><tr><th>Cliente</th><th>Usinas</th><th>Grupo</th><th>CNPJ/CPF</th><th>E-mails</th><th class="num">UCs</th><th></th></tr>';
      lista.forEach(function(c){
        var us=usinasDoCliente(c.id);
        h+='<tr><td><b>'+esc(c.nome)+'</b></td>';
        h+='<td>'+(us.length?us.map(function(x){return '<span class="chip'+(x.ativa?' info':'')+'">'+esc(x.nome.replace(/^Usina /,''))+(x.ativa?'':' (encerrada)')+'</span>';}).join(' '):'&mdash;')+'</td>';
        h+='<td>'+esc(c.grupo||'')+'</td><td class="mono">'+esc(c.cnpj_cpf||'')+'</td>';
        h+='<td>'+(c.emails&&c.emails.length?c.emails.map(function(e){return '<a href="mailto:'+esc(e)+'">'+esc(e)+'</a>';}).join('<br>'):'&mdash;')+'</td>';
        h+='<td class="num">'+(c.ucs?c.ucs.length:0)+'</td>';
        h+='<td><button class="btn sec mini" onclick="A.formCliente(&quot;'+c.id+'&quot;)">Editar</button></td></tr>';
      });h+='</table></div>';}
    h+='<p class="note">O envio automatico de relatorios por e-mail (dominio abrapesolar.com.br) entra na proxima etapa da plataforma.</p></div>';
  }else{
    h+='<div class="actbar"><button class="btn" onclick="A.formInv()">Novo investidor</button></div>';
    h+='<div class="panel">';
    if(!S.inv.length)h+='<p class="empty">Nenhum investidor cadastrado ainda.</p>';
    else{h+='<div class="tblwrap"><table><tr><th>Investidor</th><th>Usina</th><th>E-mail</th><th class="num">% contratado</th><th></th></tr>';
      S.inv.forEach(function(v){
        h+='<tr><td><b>'+esc(v.nome)+'</b></td><td>'+esc(v.usinas?v.usinas.nome:'&mdash;')+'</td><td>'+(v.email?'<a href="mailto:'+esc(v.email)+'">'+esc(v.email)+'</a>':'&mdash;')+'</td><td class="num">'+(v.percentual_contratado!==null&&v.percentual_contratado!==undefined?Number(v.percentual_contratado).toLocaleString('pt-BR')+'%':'&mdash;')+'</td>';
        h+='<td><button class="btn sec mini" onclick="A.formInv(&quot;'+v.id+'&quot;)">Editar</button></td></tr>';
      });h+='</table></div>';}
    h+='</div>';
  }
  el('main').innerHTML=h;
}

async function loadCobranca(){
  var q=await Promise.all([
    sb.from('faturas_abrape').select('*, clientes(nome,grupo), ciclos(mes_referencia, usinas(nome))').order('criado_em',{ascending:false}).limit(2000),
    sb.from('boletos').select('*, faturas_abrape(numero,ano,clientes(nome,grupo))').order('criado_em',{ascending:false}).limit(2000),
    sb.from('solicitacoes').select('id,status,criado_em,concluido_em,solicitado_por').eq('tipo','triagem').order('criado_em',{ascending:false}).limit(1)
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  S.cobFat=q[0].data;S.cobBol=q[1].data;
  if(!S.cobAba)S.cobAba='faturas';
  if(!S.cobFiltro)S.cobFiltro='receber';
  if(S.cobCliente===undefined)S.cobCliente='';
  var nomes={};
  S.cobFat.forEach(function(f){if(f.clientes&&f.clientes.nome)nomes[f.clientes.nome]=1;if(f.clientes&&f.clientes.grupo)nomes[f.clientes.grupo]=1;});
  var tri=(q[2]&&q[2].data||[])[0];

function renderCob(){
  var hojeISO=new Date().toISOString().slice(0,10);
  var termo=(S.cobCliente||'').trim().toLowerCase();
  var casa=function(cl){if(!termo)return true;if(!cl)return false;return String(cl.nome||'').toLowerCase().indexOf(termo)>-1||String(cl.grupo||'').toLowerCase().indexOf(termo)>-1;};
  var fat=S.cobFat.filter(function(f){return casa(f.clientes);});
  var bol=S.cobBol.filter(function(b){return casa(b.faturas_abrape&&b.faturas_abrape.clientes);});
  var classe=function(f){
    if(f.status==='paga')return 'pagas';
    if(f.status==='cancelada')return 'canceladas';
    if(f.status==='vencida'||(f.vencimento&&f.vencimento<hojeISO))return 'vencidas';
    return 'receber';
  };
  var classeB=function(b){
    if(b.status==='pago')return 'pagas';
    if(b.status==='cancelado')return 'canceladas';
    if(b.status==='vencido'||b.status==='expirado'||(b.vencimento&&b.vencimento<hojeISO))return 'vencidas';
    return 'receber';
  };
  var grupos={receber:[],vencidas:[],canceladas:[],pagas:[]};fat.forEach(function(f){grupos[classe(f)].push(f);});
  var gb={receber:[],vencidas:[],canceladas:[],pagas:[]};bol.forEach(function(b){gb[classeB(b)].push(b);});
  function soma(a){return a.reduce(function(x,f){return x+Number(f.valor||0);},0);}
  var k='';
  if(termo)k+='<p class="note" style="margin:-6px 0 12px">Mostrando apenas: <b>'+esc(S.cobCliente)+'</b></p>';
  k+='<div class="kpis">';
  k+='<div class="kpi"><div class="l">Contas a Receber</div><div class="v">'+money(soma(grupos.receber))+'</div><div class="d">'+grupos.receber.length+' faturas no prazo</div></div>';
  k+='<div class="kpi"'+(grupos.vencidas.length?' style="border-color:var(--bad)"':'')+'><div class="l">Contas Vencidas</div><div class="v">'+money(soma(grupos.vencidas))+'</div><div class="d">'+grupos.vencidas.length+' faturas vencidas</div></div>';
  k+='<div class="kpi"><div class="l">Total a Receber</div><div class="v">'+money(soma(grupos.receber)+soma(grupos.vencidas))+'</div><div class="d">no prazo + vencidas</div></div>';
  k+='<div class="kpi"><div class="l">Pagas</div><div class="v">'+money(soma(grupos.pagas))+'</div><div class="d">'+grupos.pagas.length+' faturas quitadas</div></div>';
  k+='</div>';
  el('cobKpis').innerHTML=k;
  var ehFat=S.cobAba==='faturas';
  var gr=ehFat?grupos:gb;
  var a='<div class="tabs" style="margin-bottom:16px">';
  a+='<button class="'+(ehFat?'on':'')+'" onclick="A.cobAba(&quot;faturas&quot;)">Faturas ABRAPE ('+fat.length+')</button>';
  a+='<button class="'+(ehFat?'':'on')+'" onclick="A.cobAba(&quot;boletos&quot;)">Boletos Banco Inter ('+bol.length+')</button></div>';
  el('cobAbas').innerHTML=a;
  var FILTROS=ehFat
    ?[['receber','A receber'],['vencidas','Vencidas'],['canceladas','Canceladas'],['pagas','Pagas']]
    :[['receber','A receber'],['vencidas','Vencidos'],['canceladas','Cancelados'],['pagas','Pagos']];
  var s='<div class="switch" style="margin:0">';
  FILTROS.forEach(function(ft){s+='<button class="'+(S.cobFiltro===ft[0]?'on':'')+'" onclick="A.cobFiltro(&quot;'+ft[0]+'&quot;)">'+ft[1]+' ('+gr[ft[0]].length+')</button>';});
  el('cobStatus').innerHTML=s+'</div>';
  var lb=el('cob-limpa');if(lb)lb.hidden=!termo;
  var lista=(gr[S.cobFiltro]||[]).slice().sort(function(a,b){return String(a.vencimento||'').localeCompare(String(b.vencimento||''));});
  var h='';
  if(ehFat){
    if(!lista.length)h+='<p class="empty">Nenhuma fatura neste filtro.</p>';
    else{h+='<div class="tblwrap"><table><tr><th>Fatura</th><th>Usina</th><th>Ciclo</th><th>Cliente</th><th class="num">Valor</th><th>Venc.</th><th>Status</th></tr>';
      lista.forEach(function(f){
        h+='<tr><td><b>'+(f.numero?f.numero+'/'+f.ano:'s/n')+'</b></td><td>'+esc(f.ciclos&&f.ciclos.usinas?f.ciclos.usinas.nome:'&mdash;')+'</td><td>'+(f.ciclos?mesLbl(f.ciclos.mes_referencia):'&mdash;')+'</td><td>'+esc(f.clientes?f.clientes.nome:'&mdash;')+'</td><td class="num">'+money(f.valor)+'</td><td>'+dt(f.vencimento)+'</td><td>'+(classe(f)==='vencidas'?'<span class="chip bad">Vencida</span>':chip(STFAT,f.status))+'</td></tr>';
      });
      h+='<tr><td colspan="4" style="text-align:right;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase">Total ('+lista.length+')</td><td class="num"><b>'+money(soma(lista))+'</b></td><td colspan="2"></td></tr>';
      h+='</table></div>';}
  } else {
    if(!lista.length)h+='<p class="empty">Nenhum boleto neste filtro.</p>';
    else{h+='<div class="tblwrap"><table><tr><th>Nosso numero</th><th>Fatura</th><th>Cliente</th><th class="num">Valor</th><th>Venc.</th><th>Status</th><th class="num">Recebido</th></tr>';
      lista.forEach(function(b){
        var fb=b.faturas_abrape;
        h+='<tr><td class="mono">'+esc(b.nosso_numero||'')+'</td><td>'+(fb?(fb.numero?fb.numero+'/'+fb.ano:'s/n'):'&mdash;')+'</td><td>'+esc(fb&&fb.clientes?fb.clientes.nome:'&mdash;')+'</td><td class="num">'+money(b.valor)+'</td><td>'+dt(b.vencimento)+'</td><td>'+(classeB(b)==='vencidas'&&b.status==='aberto'?'<span class="chip bad">Vencido</span>':chip(STBOL,b.status))+'</td><td class="num">'+money(b.valor_recebido)+'</td></tr>';
      });
      var rec=lista.reduce(function(x,b){return x+Number(b.valor_recebido||0);},0);
      h+='<tr><td colspan="3" style="text-align:right;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase">Total ('+lista.length+')</td><td class="num"><b>'+money(soma(lista))+'</b></td><td colspan="2"></td><td class="num"><b>'+(rec?money(rec):'&mdash;')+'</b></td></tr>';
      h+='</table></div>';}
  }
  el('cobCorpo').innerHTML=h;
}

var STLEAD={novo:['Novo','warn'],em_contato:['Em contato','info'],convertido:['Convertido','ok'],descartado:['Descartado','']};
async function loadSite(){
  var q=await Promise.all([
    sb.from('noticias').select('*').order('data_publicacao',{ascending:false}),
    sb.from('leads').select('*').order('criado_em',{ascending:false})
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  S.noticias=q[0].data;S.leads=q[1].data;
  renderSite();
}

        h+='<td>'+(n.url_fonte?'<a href="'+esc(n.url_fonte)+'" target="_blank">'+esc(n.fonte||'link')+'</a>':esc(n.fonte||'&mdash;'))+'</td>';

  abrirDoc:async function(path){
    var ehHtml=/\.html?$/i.test(String(path||''));
    var win=null;
    try{
      if(ehHtml){
        // o Storage entrega HTML como texto puro (protecao contra XSS): baixamos e abrimos renderizado
        win=window.open('','_blank');
        if(win)win.document.write('<p style="font-family:system-ui;padding:24px;color:#555">Abrindo o painel&hellip;</p>');
        var d=await sb.storage.from('documentos').download(path);
        if(d.error)throw d.error;
        var txt=await d.data.text();
        var url=URL.createObjectURL(new Blob([txt],{type:'text/html;charset=utf-8'}));
        if(win)win.location.replace(url); else window.open(url,'_blank');
        setTimeout(function(){URL.revokeObjectURL(url);},60000);
        return;
      }
      var r=await sb.storage.from('documentos').createSignedUrl(path,3600);
      if(r.error)throw r.error;
      window.open(r.data.signedUrl,'_blank');
    }catch(e){if(win)win.close();fail(e);}
  },

    h+='<div class="fld"><label>E-mail</label><input id="iv-email" value="'+esc(v.email||'')+'"></div>';
    h+='<div class="fld"><label>Telefone</label><input id="iv-tel" value="'+esc(v.telefone||'')+'"></div>';
    h+='<div class="fld"><label>Usina</label><select id="iv-usina"><option value="">&mdash;</option>';
    S.usinas.forEach(function(u){h+='<option value="'+u.id+'"'+(v.usina_id===u.id?' selected':'')+'>'+esc(u.nome)+'</option>';});
    h+='</select></div>';
    h+='<div class="fld"><label>% contratado</label><input id="iv-pct" type="number" step="0.01" value="'+(v.percentual_contratado!==null&&v.percentual_contratado!==undefined?v.percentual_contratado:'')+'"></div>';
    h+='<div class="fld full"><label>Observacoes</label><textarea id="iv-obs">'+esc(v.observacoes||'')+'</textarea></div>';
    h+='</div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="A.salvarInv('+(id?'&quot;'+id+'&quot;':'null')+')">Salvar</button><button class="btn sec" onclick="A.closeModal()">Cancelar</button></div>';
    A.modal(h);
  },
  salvarInv:async function(id){
    try{
      var body={nome:val('iv-nome'),cnpj_cpf:val('iv-doc')||null,email:val('iv-email')||null,telefone:val('iv-tel')||null,usina_id:val('iv-usina')||null,percentual_contratado:val('iv-pct')||null,observacoes:val('iv-obs')||null};
      if(!body.nome)throw new Error('Informe o nome.');
      var r=id?await sb.from('investidores').update(body).eq('id',id):await sb.from('investidores').insert(body);
      if(r.error)throw r.error;
      A.closeModal();toast('Investidor salvo.');loadClientes().catch(fail);
    }catch(e){fail(e);}
  },
  addUsuario:async function(){
    try{
      var r=await sb.from('usuarios_autorizados').insert({email:val('nu-email').toLowerCase(),nome:val('nu-nome'),papel:val('nu-papel')});
      if(r.error)throw r.error;toast('Usuario autorizado.');loadAdmin().catch(fail);
    }catch(e){fail(e);}
  },
  modal:function(html){
    var bg=document.createElement('div');bg.id='modalbg';
    bg.innerHTML='<div id="modal">'+html+'</div>';
    bg.addEventListener('click',function(ev){if(ev.target===bg)A.closeModal();});
    document.body.appendChild(bg);
  },
  closeModal:function(){var m=el('modalbg');if(m)m.remove();}
};
window.go=go;

sb.auth.onAuthStateChange(function(ev,session){
  if(ev==='SIGNED_IN'&&!S.perfil)enter().catch(fail);
  if(ev==='SIGNED_OUT'){S.perfil=null;showLogin();}
});
sb.auth.getSession().then(function(r){
  if(r.data&&r.data.session)enter().catch(fail);else showLogin();
});
</script>
</body>
</html>
