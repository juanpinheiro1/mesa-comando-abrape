<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de Comando ABRAPE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#F6F4EE; --surface:#FFFFFF; --surface2:#EFEBE0; --ink:#1C2B3A; --muted:#66727F;
  --line:#E0DACB; --gold:#B07C10; --goldink:#8A5F06; --teal:#0E7C7B;
  --ok:#2E7D4F; --warn:#A06F0A; --bad:#B4452F; --info:#3B6EA5;
  --chip-ok:#E3F0E8; --chip-warn:#F6ECD4; --chip-bad:#F7E3DE; --chip-info:#E2ECF6; --chip-mut:#ECEAE2;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F161D; --surface:#18222C; --surface2:#141D26; --ink:#E8E3D6; --muted:#93A0AD;
  --line:#2A3743; --gold:#E3B34C; --goldink:#E3B34C; --teal:#43B5B2;
  --ok:#5BBF8A; --warn:#E3B34C; --bad:#E07B62; --info:#7FA8D0;
  --chip-ok:#1B3327; --chip-warn:#372B12; --chip-bad:#3A211B; --chip-info:#1D2C3C; --chip-mut:#232E39;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit}
a{color:var(--teal)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .bt{line-height:1.15}
.brand .bt b{display:block;font-weight:800;letter-spacing:.08em;font-size:13px}
.brand .bt span{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
nav button.on{background:var(--surface2);color:var(--ink)}
nav button:hover{color:var(--ink)}
.userchip{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.userchip b{color:var(--ink);font-weight:600}
.userchip button{border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer}
main{padding-block:26px 60px}
.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:22px;font-weight:700}
.pagehead .sub{color:var(--muted);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.card:hover{border-color:var(--gold)}
.card h3{font-size:16px;font-weight:700}
.card .meta{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;min-width:12px;border-radius:50%;display:inline-block}
.mesnav{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.mesnav select.inline{font-size:14px;font-weight:600;padding:6px 10px}
.mesnav .btn.mini[disabled]{opacity:.35;cursor:default}
.cobbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cobbusca{display:flex;align-items:center;gap:6px;margin-left:auto;flex:1;min-width:240px;max-width:460px}
.cobbusca input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
.prog{margin:4px 0 2px}
.prog-top{display:flex;justify-content:space-between;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:5px}
.prog-top b{font-size:13px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.prog-bar{height:8px;border-radius:99px;background:color-mix(in srgb, var(--ink) 10%, transparent);overflow:hidden}
.prog-bar div{height:100%;border-radius:99px;transition:width .4s ease}
.prog-pend{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:12.5px}
.prog-pend li{display:flex;align-items:center;gap:7px}
.prog-pend li::before{content:'';width:6px;height:6px;border-radius:50%;flex-shrink:0;background:var(--muted)}
.prog-pend li.bad{color:var(--bad)}.prog-pend li.bad::before{background:var(--bad)}
.prog-pend li.warn{color:var(--warn)}.prog-pend li.warn::before{background:var(--warn)}
.prog-pend li.muted{color:var(--muted)}
.prog-ok{margin-top:7px;font-size:12.5px;color:var(--ok)}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--chip-mut);color:var(--muted);letter-spacing:.02em}
.chip.ok{background:var(--chip-ok);color:var(--ok)}
.chip.warn{background:var(--chip-warn);color:var(--warn)}
.chip.bad{background:var(--chip-bad);color:var(--bad)}
.chip.info{background:var(--chip-info);color:var(--info)}
.chip.gold{background:var(--chip-warn);color:var(--goldink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.panel h2{font-size:15px;font-weight:700;margin-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;margin-bottom:-1px}
.tabs button.on{color:var(--goldink);border-bottom-color:var(--gold)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:none}
.btn{background:var(--gold);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-weight:700;font-size:13.5px;cursor:pointer}
@media (prefers-color-scheme: dark){.btn{color:#14100a}}
.btn:hover{filter:brightness(1.06)}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.mini{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.danger{background:none;border:1px solid var(--line);color:var(--bad)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.frm .full{grid-column:1/-1}
.fld label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:14px}
.fld textarea{min-height:70px;resize:vertical}
select.inline{padding:4px 6px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:12.5px}
.empty{color:var(--muted);font-size:13.5px;padding:14px 0}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;font-weight:600;z-index:99;max-width:90vw}
#toast.err{background:var(--bad);color:#fff}
#modalbg{position:fixed;inset:0;background:rgba(10,14,18,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:640px;width:100%;max-height:85vh;overflow:auto}
#modal h2{font-size:16px;margin-bottom:14px}
.login{min-height:92vh;display:flex;align-items:center;justify-content:center;padding:20px}
.logincard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px;max-width:400px;width:100%}
.logincard .brand{justify-content:center;margin-bottom:6px}
.logincard p.tag{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 18px}
.logincard .fld{margin-bottom:12px}
.switch{display:flex;gap:4px;background:var(--surface2);border-radius:9px;padding:3px;margin-bottom:16px}
.switch button{flex:1;border:none;background:none;padding:7px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted);font-size:13.5px}
.switch button.on{background:var(--surface);color:var(--ink)}
.actbar{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin-bottom:14px}
.mono{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SB_URL='https://puepmnyffpfjttxmwfjt.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1ZXBtbnlmZnBmanR0eG13Zmp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTMzMzksImV4cCI6MjEwNTIyOTMzOX0.6waSiEVZE0Fm2QraExivstM8qjzK7NGQ6698wmzHxjw';
var sb=window.supabase.createClient(SB_URL,SB_KEY);
var S={perfil:null,view:'dash',usinaId:null,usinaTab:'ciclos',cliTab:'clientes',usinas:[],clientes:[]};
var MESES=['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var TIPODOC={conta_geradora:'Conta da UC geradora',demonstrativo_energisa:'Demonstrativo Energisa/CPFL',conta_uc_recebedora:'Conta de UC recebedora',demonstrativo_abrape:'Demonstrativo ABRAPE',demonstrativo_geracao:'Demonstrativo de Geracao',relatorio_cliente:'Relatorio de cliente',relatorio_investidor:'Relatorio de investidor',boleto:'Boleto',rateio_planilha:'Planilha de rateio',outro:'Outro'};
var STCICLO={aberto:['Aberto','warn'],documentos:['Documentos carregados','info'],conferido:['Conferido','info'],faturado:['Faturado','gold'],concluido:['Concluido','ok']};
var STFAT={emitida:['Em aberto','warn'],paga:['Paga','ok'],vencida:['Vencida','bad'],cancelada:['Cancelada','']};
var STBOL={aberto:['Em aberto','warn'],pago:['Pago','ok'],vencido:['Vencido','bad'],expirado:['Expirado',''],cancelado:['Cancelado','']};
function esc(s){if(s===null||s===undefined)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){if(n===null||n===undefined||n==='')return '&mdash;';return Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function kwh(n){if(n===null||n===undefined||n==='')return '&mdash;';return Number(n).toLocaleString('pt-BR')+' kWh';}
function mesLbl(d){if(!d)return '&mdash;';var p=String(d).split('-');return MESES[Number(p[1])-1]+'/'+p[0];}
function dt(d){if(!d)return '&mdash;';var p=String(d).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function chip(map,k){var c=map[k]||[k,''];return '<span class="chip '+c[1]+'">'+esc(c[0])+'</span>';}
function el(id){return document.getElementById(id);}
function val(id){var e=el(id);return e?e.value.trim():'';}
function toast(m,err){var t=el('toast');if(t)t.remove();var d=document.createElement('div');d.id='toast';if(err)d.className='err';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},err?6000:3200);}
function fail(e){console.error(e);toast((e&&e.message)?e.message:'Erro inesperado',true);}
function mark(){return '<svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="9" fill="var(--gold)"/><g stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round"><line x1="20" y1="7" x2="20" y2="3"/><line x1="20" y1="33" x2="20" y2="37"/><line x1="7" y1="20" x2="3" y2="20"/><line x1="33" y1="20" x2="37" y2="20"/><line x1="10.8" y1="10.8" x2="8" y2="8"/><line x1="29.2" y1="10.8" x2="32" y2="8"/><line x1="10.8" y1="29.2" x2="8" y2="32"/><line x1="29.2" y1="29.2" x2="32" y2="32"/></g></svg>';}
function brand(){return '<div class="brand">'+mark()+'<div class="bt"><b>ABRAPE SOLAR</b><span>Mesa de Comando</span></div></div>';}

// ---------- AUTH ----------

  '</div></div>';

function showNoAccess(email){
  el('app').innerHTML='<div class="login"><div class="logincard">'+brand()+
  '<p class="tag">Acesso nao autorizado</p><p style="font-size:14px">O e-mail <b>'+esc(email)+'</b> nao esta na lista de usuarios autorizados da ABRAPE SOLAR. Fale com o administrador.</p>'+
  '<button class="btn sec" style="width:100%;margin-top:14px" onclick="A.sair()">Sair</button></div></div>';
}
async function enter(){
  var r=await sb.rpc('minha_autorizacao');
  if(r.error){fail(r.error);return;}
  if(!r.data||!r.data.length){var u=await sb.auth.getUser();showNoAccess(u.data&&u.data.user?u.data.user.email:'');return;}
  S.perfil=r.data[0];
  renderShell();go('dash');
}
function renderShell(){
  el('app').innerHTML='<header class="topbar"><div class="wrap">'+brand()+
  '<nav><button id="nv-dash" onclick="go(&quot;dash&quot;)">Usinas</button>'+
  '<button id="nv-cli" onclick="go(&quot;cli&quot;)">Clientes</button>'+
  '<button id="nv-cob" onclick="go(&quot;cob&quot;)">Cobranca</button>'+
  '<button id="nv-site" onclick="go(&quot;site&quot;)">Site</button>'+
  '<button id="nv-adm" onclick="go(&quot;adm&quot;)">Administracao</button></nav>'+
  '<div class="userchip"><span><b>'+esc(S.perfil.nome)+'</b> &middot; '+(S.perfil.papel==='admin'?'Admin':'Operacao')+'</span><button onclick="A.sair()">Sair</button></div>'+
  '</div></header><main class="wrap" id="main"></main>';
}
function go(v,arg){
  S.view=v;
  ['dash','cli','cob','site','adm'].forEach(function(k){var b=el('nv-'+k);if(b)b.classList.toggle('on',k===v||(v==='usina'&&k==='dash'));});
  el('main').innerHTML='<p class="empty">Carregando&hellip;</p>';
  if(v==='site')loadSite().catch(fail);
  if(v==='dash')loadDash().catch(fail);
  if(v==='usina'){S.usinaId=arg||S.usinaId;S.usinaTab='ciclos';S.cicloSel=null;loadUsina().catch(fail);}
  if(v==='cli')loadClientes().catch(fail);
  if(v==='cob')loadCobranca().catch(fail);
  if(v==='adm')loadAdmin().catch(fail);
}

var TIPOS_ENVIO=['relatorio_cliente','boleto','relatorio_investidor'];
// ---------- DASHBOARD ----------
async function loadDash(){
  var hoje=new Date();
  var hojeISO=hoje.toISOString().slice(0,10);
  var q=await Promise.all([
    sb.from('usinas').select('*').order('nome'),
    sb.from('ciclos').select('*').order('mes_referencia',{ascending:false}),
    sb.from('faturas_abrape').select('id,numero,ano,valor,vencimento,status,ciclo_id, clientes(nome), ciclos(usina_id,mes_referencia)'),
    sb.from('boletos').select('valor,status'),
    sb.from('solicitacoes').select('id,tipo,ciclo_id,usina_id,criado_em,observacoes, usinas(nome), ciclos(mes_referencia)').eq('status','pendente'),
    sb.from('rateios').select('usina_id,uc_id,vigencia_fim'),
    sb.from('compensacoes').select('ciclo_id,status').in('status',['pendente','verificar']),
    sb.from('ucs').select('id,proxima_leitura'),
    sb.from('documentos').select('ciclo_id,uc_id,tipo').not('ciclo_id','is',null),
    sb.from('compensacoes').select('ciclo_id,uc_id,status'),
    sb.from('lembretes').select('*').is('resolvido_em',null).order('criado_em'),
    sb.from('documentos').select('id,nome_arquivo,tipo,ciclo_id,usina_id,uc_id,criado_em, usinas(nome), ciclos(mes_referencia)').is('enviado_em',null).in('tipo',TIPOS_ENVIO).not('ciclo_id','is',null),
    sb.from('solicitacoes').select('id,status,observacoes,criado_em,concluido_em,solicitado_por').eq('tipo','atencao').neq('status','cancelada').order('criado_em',{ascending:false}).limit(300)
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  var usinas=q[0].data;S.usinas=usinas;
  var lembretes=q[10].data||[];
  S.saida=q[11].data||[];
  S.respAt={};(q[12].data||[]).forEach(function(r){try{var o=JSON.parse(r.observacoes||'{}');if(o.item_key&&!S.respAt[o.item_key]){r.o=o;S.respAt[o.item_key]=r;}}catch(e){}});
  S.saidaFila={};q[4].data.forEach(function(x){if(x.tipo==='enviar'){try{(JSON.parse(x.observacoes||'{}').documentos||[]).forEach(function(id){S.saidaFila[id]=1;});}catch(e){}}});
  var docsCiclo={};q[8].data.forEach(function(d){(docsCiclo[d.ciclo_id]=docsCiclo[d.ciclo_id]||[]).push(d);});
  var compsCiclo={};q[9].data.forEach(function(x){(compsCiclo[x.ciclo_id]=compsCiclo[x.ciclo_id]||[]).push(x);});
  var ciclos=q[1].data, faturas=q[2].data, fila=q[4].data;
  // S.dashMes = null -> painel atual (ciclo mais recente de cada usina); 'YYYY-MM-01' -> ciclos daquele mes
  var mesesDisp=[];ciclos.forEach(function(c){var m=String(c.mes_referencia).slice(0,10);if(mesesDisp.indexOf(m)<0)mesesDisp.push(m);});
  mesesDisp.sort().reverse();S.dashMesesDisp=mesesDisp;
  if(S.dashMes&&mesesDisp.indexOf(S.dashMes)<0)S.dashMes=null;
  var modoHist=!!S.dashMes;
  var latest={};ciclos.forEach(function(c){
    if(modoHist){if(String(c.mes_referencia).slice(0,10)===S.dashMes)latest[c.usina_id]=c;}
    else if(!latest[c.usina_id])latest[c.usina_id]=c;
  });
  var ucsCount={};q[5].data.forEach(function(r){if(!r.vigencia_fim)ucsCount[r.usina_id]=(ucsCount[r.usina_id]||0)+1;});
  var pendCiclo={};q[6].data.forEach(function(x){if(x.status!=='ok')pendCiclo[x.ciclo_id]=(pendCiclo[x.ciclo_id]||0)+1;});
  var atrasadas=faturas.filter(function(f){return f.status==='vencida'||(f.status==='emitida'&&f.vencimento&&f.vencimento<hojeISO);});
  var atrPorUsina={};atrasadas.forEach(function(f){
    if(!f.ciclos)return;
    if(modoHist){var lc=latest[f.ciclos.usina_id];if(!lc||lc.id!==f.ciclo_id)return;}
    atrPorUsina[f.ciclos.usina_id]=(atrPorUsina[f.ciclos.usina_id]||0)+1;
  });
  var fab=faturas.filter(function(f){return f.status==='emitida'||f.status==='vencida';});
  var vab=fab.reduce(function(a,f){return a+Number(f.valor||0);},0);
  var bven=q[3].data.filter(function(b){return b.status==='vencido'||b.status==='expirado';}).length;
  var ativas=usinas.filter(function(u){return u.ativo;});
  var conclMes=ativas.filter(function(u){var c=latest[u.id];return c&&c.status==='concluido';}).length;

  // DATA PROXIMO CICLO = proxima leitura impressa na conta da UC geradora (coletada a cada ciclo processado)
  var ucProx={};q[7].data.forEach(function(x){if(x.proxima_leitura)ucProx[x.id]=x.proxima_leitura;});
  var ucsDaUsina={};q[5].data.forEach(function(r){if(!r.vigencia_fim){(ucsDaUsina[r.usina_id]=ucsDaUsina[r.usina_id]||[]).push(r.uc_id);}});
  var dts=function(iso){var p=String(iso).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0].slice(2);};
  var proxInfo=function(u){
    var c=latest[u.id];
    if(modoHist)return null;
    if(c&&c.status!=='concluido')return null;
    var datas=[];
    if(u.uc_geradora_id&&ucProx[u.uc_geradora_id])datas.push(ucProx[u.uc_geradora_id]);
    else (ucsDaUsina[u.id]||[]).forEach(function(uid){if(ucProx[uid])datas.push(ucProx[uid]);});
    if(!datas.length)return null;
    datas.sort();
    var d=datas[0];
    return {d:d, overdue: d<=hojeISO};
  };
  // urgencia: 0=pendencia, 1=data do proximo ciclo chegou, 2=em andamento, 3=faturado, 4=concluido em dia, 5=sem ciclo/sem dia
  var nivel=function(u){
    var c=latest[u.id];
    var atrCic=c?atrasadas.filter(function(f){return f.ciclo_id===c.id;}).length:0;
    var pend=(c?(pendCiclo[c.id]||0):0)+atrCic;
    if(pend>0)return 0;
    var pi=proxInfo(u);
    if(pi&&pi.overdue)return 1;
    if(!c)return 5;
    if(c.status==='concluido')return 4;
    if(c.status==='faturado')return 3;
    return 2;
  };
  var CORLUZ=['var(--bad)','var(--bad)','var(--warn)','var(--ok)','var(--ok)','var(--muted)'];

  // progresso do ciclo: media de 5 etapas (conta geradora, contas das UCs, apuracao, faturamento, recebimento)
  var progresso=function(u){
    var c=latest[u.id];
    if(!c)return null;
    var ds=docsCiclo[c.id]||[], cs=compsCiclo[c.id]||[];
    var pend=[];
    var temGer=u.modelo==='autoconsumo'
      ? ds.some(function(d){return d.tipo==='conta_uc_recebedora'||d.tipo==='conta_geradora';})
      : ds.some(function(d){return d.tipo==='conta_geradora'||d.tipo==='demonstrativo_energisa';});
    var ucsEsperadas=cs.length?cs.map(function(x){return x.uc_id;}):(ucsDaUsina[u.id]||[]);
    var comConta=ucsEsperadas.filter(function(uid){
      return ds.some(function(d){return d.uc_id===uid&&d.tipo==='conta_uc_recebedora';})||cs.some(function(x){return x.uc_id===uid&&x.status==='ok';});
    }).length;
    var fContas=ucsEsperadas.length?comConta/ucsEsperadas.length:0;
    var ok=cs.filter(function(x){return x.status==='ok';}).length;
    var fApur=cs.length?ok/cs.length:0;
    var fFat=(c.status==='faturado'||c.status==='concluido')?1:0;
    var fs=faturas.filter(function(f){return f.ciclo_id===c.id&&f.status!=='cancelada';});
    var pagas=fs.filter(function(f){return f.status==='paga';}).length;
    var fRec=fs.length?pagas/fs.length:(c.status==='concluido'?1:0);
    var pct=Math.round(((temGer?1:0)+fContas+fApur+fFat+fRec)/5*100);
    if(c.status==='concluido')pct=100;
    if(c.status!=='concluido'){
      if(!temGer)pend.push({t:u.modelo==='autoconsumo'?'Conta de energia pendente':'Conta da geradora pendente',s:'bad'});
      var semConta=ucsEsperadas.length-comConta;
      if(semConta>0)pend.push({t:semConta+' conta'+(semConta===1?'':'s')+' de UC pendente'+(semConta===1?'':'s'),s:'bad'});
      var aVer=cs.length-ok;
      if(aVer>0)pend.push({t:aVer+' UC'+(aVer===1?'':'s')+' a verificar',s:'bad'});
      if(!fFat&&cs.length&&!aVer&&!semConta)pend.push({t:'Pronto para faturar',s:'warn'});
      else if(!fFat)pend.push({t:'Faturamento pendente',s:'warn'});
    }
    var atr=fs.filter(function(f){return f.status==='vencida'||(f.status==='emitida'&&f.vencimento&&f.vencimento<hojeISO);}).length;
    var aguard=fs.filter(function(f){return f.status==='emitida'&&!(f.vencimento&&f.vencimento<hojeISO);}).length;
    if(atr)pend.push({t:atr+' fatura'+(atr===1?'':'s')+' em atraso',s:'bad'});
    if(aguard)pend.push({t:aguard+' aguardando pagamento',s:'muted'});
    var antigas=atrasadas.filter(function(f){return f.ciclos&&f.ciclos.usina_id===u.id&&f.ciclo_id!==c.id;}).length;
    if(antigas)pend.push({t:antigas+' fatura'+(antigas===1?'':'s')+' vencida'+(antigas===1?'':'s')+' de ciclo anterior',s:'bad'});
    return {pct:pct,pend:pend};
  };

  var opcoes=[null].concat(mesesDisp);
  var idx=opcoes.indexOf(S.dashMes||null);
  var h='<div class="pagehead"><h1>Painel das Usinas</h1>';
  h+='<div class="mesnav">';
  h+='<button class="btn sec mini" title="Mes anterior" '+(idx>=opcoes.length-1?'disabled':'')+' onclick="A.dashMes('+(idx+1)+')">&lsaquo;</button>';
  h+='<select class="inline" onchange="A.dashMes(this.selectedIndex)">';
  opcoes.forEach(function(m){h+='<option'+((m||null)===(S.dashMes||null)?' selected':'')+'>'+(m?mesLbl(m):'Atual &mdash; '+MESES[hoje.getMonth()]+'/'+hoje.getFullYear())+'</option>';});
  h+='</select>';
  h+='<button class="btn sec mini" title="Proximo mes" '+(idx<=0?'disabled':'')+' onclick="A.dashMes('+(idx-1)+')">&rsaquo;</button>';
  if(modoHist)h+='<button class="btn mini" onclick="A.dashMes(0)">Voltar ao atual</button>';
  h+='</div></div>';
  if(modoHist)h+='<p class="note" style="margin:-6px 0 16px">Painel historico: cada usina mostra o ciclo de <b>'+mesLbl(S.dashMes)+'</b>. Os indicadores de faturas em aberto, atraso e fila continuam globais.</p>';
  h+='<div class="kpis">';
  h+='<div class="kpi"><div class="l">Usinas ativas</div><div class="v">'+ativas.length+'</div></div>';
  h+='<div class="kpi"><div class="l">Ciclos concluidos</div><div class="v">'+conclMes+' / '+ativas.length+'</div><div class="d">no ciclo mais recente de cada usina</div></div>';
  h+='<div class="kpi"><div class="l">Faturas em aberto</div><div class="v">'+fab.length+'</div><div class="d">'+money(vab)+'</div></div>';
  h+='<div class="kpi"'+(atrasadas.length?' style="border-color:var(--bad)"':'')+'><div class="l">Em atraso</div><div class="v">'+atrasadas.length+'</div><div class="d">faturas vencidas sem pagamento</div></div>';
  var nSaida=S.saida.filter(function(d){return !S.saidaFila[d.id];}).length, nNaFila=S.saida.length-nSaida;
  h+='<div class="kpi" style="cursor:pointer;'+(nSaida?'border-color:var(--info, #2f6fb0)':'')+'" onclick="A.caixaSaida()" title="Abrir a caixa de saida"><div class="l">Caixa de saida</div><div class="v">'+nSaida+'</div><div class="d">'+(nSaida?'documento'+(nSaida>1?'s':'')+' sem enviar &mdash; clique para enviar':'nada pendente de envio')+(nNaFila?' &middot; '+nNaFila+' ja na fila':'')+'</div></div>';
  h+='<div class="kpi"'+(fila.length?' style="border-color:var(--gold)"':'')+'><div class="l">Fila do Claude</div><div class="v">'+fila.length+'</div><div class="d">'+(fila.length?'solicitacoes aguardando &mdash; diga &quot;roda a fila&quot;':'nenhuma solicitacao pendente')+'</div></div>';
  h+='</div><div class="grid">';

  var cardUsina=function(u){
    var c=latest[u.id];
    var nv=nivel(u);
    var pend=(c?(pendCiclo[c.id]||0):0), atr=(atrPorUsina[u.id]||0);
    var cor=u.ativo?CORLUZ[nv]:'var(--muted)';
    var fundo='background:color-mix(in srgb, '+cor+' 13%, var(--surface));border-color:color-mix(in srgb, '+cor+' 45%, var(--line));';
    var x='<div class="card" style="'+fundo+(u.ativo?'':'opacity:.55;')+'" onclick="go(&quot;usina&quot;,&quot;'+u.id+'&quot;)">';
    x+='<h3 style="margin:0">'+esc(u.nome)+'</h3>';
    x+='<div class="meta">'+esc(u.distribuidora)+(u.cidade?' &middot; '+esc(u.cidade)+'/'+esc(u.uf):'')+' &middot; '+(ucsCount[u.id]||0)+' UC'+((ucsCount[u.id]||0)===1?'':'s')+' recebedora'+((ucsCount[u.id]||0)===1?'':'s')+'</div>';
    if(u.ativo){
      if(c){
        if(modoHist)x+='<div style="font-size:13px"><span style="color:var(--muted)">Ciclo exibido:</span> <b>'+mesLbl(c.mes_referencia)+'</b></div>';
        else if(c.status==='concluido')x+='<div style="font-size:13px"><span style="color:var(--muted)">Ultimo ciclo processado:</span> <b>'+mesLbl(c.mes_referencia)+'</b></div>';
        else x+='<div style="font-size:13px"><span style="color:var(--muted)">Ciclo em acao:</span> <b>'+mesLbl(c.mes_referencia)+'</b></div>';
      } else x+='<div style="font-size:13px;color:var(--muted)">'+(modoHist?'Sem ciclo neste mes':'Nenhum ciclo aberto')+'</div>';
      var pi=proxInfo(u);
      if(pi){
        if(pi.overdue)x+='<div style="font-size:13px;color:var(--bad)"><b>Proximo ciclo: '+dts(pi.d)+'</b> &mdash; coletar a conta e iniciar!</div>';
        else x+='<div style="font-size:13px"><span style="color:var(--muted)">Proximo ciclo:</span> <b>'+dts(pi.d)+'</b> <span style="color:var(--muted);font-size:11.5px">(leitura da geradora)</span></div>';
      }
    }
    if(u.ativo){
      var pg=progresso(u);
      if(pg){
        x+='<div class="prog"><div class="prog-top"><span>Progresso do ciclo</span><b>'+pg.pct+'%</b></div>';
        x+='<div class="prog-bar"><div style="width:'+pg.pct+'%;background:'+cor+'"></div></div>';
        if(pg.pend.length){
          x+='<ul class="prog-pend">';
          pg.pend.forEach(function(p){x+='<li class="'+p.s+'">'+esc(p.t)+'</li>';});
          x+='</ul>';
        } else if(pg.pct===100) x+='<div class="prog-ok">Tudo concluido neste ciclo</div>';
        x+='</div>';
      }
    }
    x+='<div class="chips"><span class="chip '+(u.modelo==='autoconsumo'?'info':'')+'">'+(u.modelo==='autoconsumo'?'Autoconsumo':'Distribuicao')+'</span>';
    if(u.tem_investidor)x+='<span class="chip gold">Investidor</span>';
    if(u.ativo&&c)x+=chip(STCICLO,c.status);
    if(!u.ativo)x+='<span class="chip">Inativa</span>';
    return x+'</div></div>';
  };
  ativas.slice().sort(function(a,b){var d=nivel(a)-nivel(b);return d!==0?d:a.nome.localeCompare(b.nome);}).forEach(function(u){h+=cardUsina(u);});
  h+='</div>';

  // ---- bloco Atencao (abaixo dos cards) ----
  var itens=[];
  lembretes.forEach(function(l){
    var un=usinas.filter(function(u){return u.id===l.usina_id;})[0];
    itens.push({key:'lembrete:'+l.id, uid:l.usina_id, lid:l.id, txt:'<b>Lembrete'+(un?' &middot; '+esc(un.nome):'')+':</b> '+esc(l.texto)+' <span style="color:var(--muted);font-size:12px">('+dt(l.criado_em)+')</span>', tipo:'info'});
  });
  atrasadas.forEach(function(f){
    var un=usinas.filter(function(u){return f.ciclos&&u.id===f.ciclos.usina_id;})[0];
    itens.push({key:'fatura:'+f.id, uid:un?un.id:null, txt:'Fatura '+(f.numero?f.numero+'/'+f.ano:'s/n')+' &middot; '+esc(f.clientes?f.clientes.nome:'')+' &middot; '+money(f.valor)+' &middot; venceu '+dt(f.vencimento)+(un?' &mdash; '+esc(un.nome):''), tipo:'bad'});
  });
  ativas.forEach(function(u){
    var c=latest[u.id];
    if(c&&pendCiclo[c.id])itens.push({key:'pend:'+c.id, cid:c.id, uid:u.id, txt:esc(u.nome)+' &middot; ciclo '+mesLbl(c.mes_referencia)+': '+pendCiclo[c.id]+' UC(s) com apuracao pendente/verificar', tipo:'warn'});
    var pi=proxInfo(u);
    if(pi&&pi.overdue)itens.push({key:'leitura:'+u.id+':'+pi.d, uid:u.id, txt:esc(u.nome)+' &middot; leitura da geradora em '+dts(pi.d)+' &mdash; coletar a conta de energia e iniciar o novo ciclo', tipo:'bad'});
  });
  fila.filter(function(s){return s.tipo!=='atencao';}).forEach(function(s){
    itens.push({uid:s.usina_id, txt:'Fila do Claude: '+({processar:'processar',faturar:'faturar',enviar:'enviar relatorios',novo_documento:'arquivo novo para atualizar'}[s.tipo])+' &middot; '+esc(s.usinas?s.usinas.nome:'')+' &middot; ciclo '+(s.ciclos?mesLbl(s.ciclos.mes_referencia):'')+' (solicitado '+dt(s.criado_em)+')', tipo:'gold'});
  });
  h+='<div class="panel" style="margin-top:22px'+(itens.length?';border-color:var(--warn)':'')+'"><div style="display:flex;align-items:center;gap:10px"><h2 style="margin:0">Atencao</h2><button class="btn sec mini" style="margin-left:auto" onclick="A.novoLembrete(null)">+ Lembrete</button></div><div style="height:10px"></div>';
  if(!itens.length)h+='<p class="empty">Nada exigindo acao no momento &mdash; tudo em dia.</p>';
  else{h+='<div class="tblwrap"><table>';
    S.atItens=itens;
    itens.forEach(function(it,ix){
      var rs=it.key?S.respAt[it.key]:null, rtxt='';
      if(rs){
        var st=rs.status==='pendente'?'<span class="chip warn">Solucao proposta &middot; aguardando fila</span>':rs.status==='em_execucao'?'<span class="chip info">Com o Juan para decisao</span>':'<span class="chip ok">Decidido'+(rs.concluido_em?' '+dt(rs.concluido_em):'')+'</span>';
        rtxt='<div style="margin-top:6px;font-size:12.5px;color:var(--muted)">'+st+' <b>Proposta:</b> '+esc(rs.o.solucao||'')+(rs.o.decisao?'<br><b>Decisao final:</b> '+esc(rs.o.decisao):'')+'</div>';
      }
      h+='<tr><td style="width:14px"><span class="dot" style="background:var(--'+(it.tipo==='bad'?'bad':it.tipo==='warn'?'warn':it.tipo==='info'?'info, #2f6fb0':'gold')+')"></span></td><td>'+it.txt+rtxt+'</td>';
      h+='<td style="white-space:nowrap">'+(it.key&&(!rs||rs.status!=='em_execucao')?'<button class="btn mini" onclick="A.responderAtencao('+ix+')">'+(rs&&rs.status==='pendente'?'Editar resposta':'Responder')+'</button> ':'')+(it.lid?'<button class="btn sec mini" onclick="A.resolverLembrete(&quot;'+it.lid+'&quot;)">Resolvido</button> ':'')+(it.uid?'<button class="btn sec mini" onclick="go(&quot;usina&quot;,&quot;'+it.uid+'&quot;)">Abrir</button>':'')+'</td></tr>';
    });h+='</table></div>';}
  h+='</div>';

  var inativas=usinas.filter(function(u){return !u.ativo;});
  if(inativas.length){
    if(S.showInativas){
      h+='<h2 style="font-size:14px;color:var(--muted);margin:22px 0 10px">Usinas inativas <button class="btn sec mini" onclick="A.toggleInativas()">ocultar</button></h2><div class="grid">';
      inativas.forEach(function(u){h+=cardUsina(u);});
      h+='</div>';
    } else {
      h+='<p class="note" style="margin-top:14px"><a href="javascript:void(0)" onclick="A.toggleInativas()">Mostrar '+inativas.length+' usina(s) inativa(s)</a></p>';
    }
  }
  el('main').innerHTML=h;
}

// ---------- USINA ----------
async function loadUsina(){
  var id=S.usinaId;
  var q=await Promise.all([
    sb.from('usinas').select('*').eq('id',id).single(),
    sb.from('ciclos').select('*').eq('usina_id',id).order('mes_referencia',{ascending:false}),
    sb.from('rateios').select('*, ucs(id,numero_uc,endereco,cidade,tipo,multi_fonte,clientes(id,nome))').eq('usina_id',id),
    sb.from('condicoes_comerciais').select('*').eq('usina_id',id),
    sb.from('geracao_mensal').select('*').eq('usina_id',id).order('mes_geracao',{ascending:false}),
    sb.from('documentos').select('*, ciclos(mes_referencia)').eq('usina_id',id).order('criado_em',{ascending:false}),
    sb.from('clientes').select('id,nome').order('nome'),
    sb.from('compensacoes').select('*, ucs(numero_uc,clientes(nome)), ciclos!inner(usina_id)').eq('ciclos.usina_id',id),
    sb.from('solicitacoes').select('*').eq('usina_id',id).order('criado_em',{ascending:false}),
    sb.from('lembretes').select('*').eq('usina_id',id).is('resolvido_em',null).order('criado_em')
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  S.u={usina:q[0].data,ciclos:q[1].data,rateios:q[2].data,cond:q[3].data,ger:q[4].data,docs:q[5].data,comp:q[7].data,sol:q[8].data,lemb:q[9].data||[]};
  S.clientes=q[6].data;
  var fr=await sb.from('faturas_abrape').select('*, clientes(nome), ciclos!inner(usina_id,mes_referencia)').eq('ciclos.usina_id',id).order('criado_em',{ascending:false});
  if(fr.error)throw fr.error;
  S.u.faturas=fr.data;
  S.u.ger_uc=null;
  if(S.u.usina.uc_geradora_id){
    var gq=await sb.from('ucs').select('*').eq('id',S.u.usina.uc_geradora_id).single();
    if(!gq.error)S.u.ger_uc=gq.data;
  }
  renderUsina();
}

function ucsDoCiclo(cs){
  var mg=String(cs.mes_geracao||cs.mes_referencia).slice(0,10);
  var vistos={};
  return (S.u.rateios||[]).filter(function(r){
    if(!r.ucs||r.ucs.tipo==='geradora')return false;
    if(r.vigencia_inicio&&String(r.vigencia_inicio).slice(0,10)>mg)return false;
    if(r.vigencia_fim&&String(r.vigencia_fim).slice(0,10)<mg)return false;
    if(vistos[r.uc_id])return false;vistos[r.uc_id]=1;return true;
  }).sort(function(a,b){return Number(b.percentual||0)-Number(a.percentual||0);});
}
function ucRot(r){var c=r.ucs&&r.ucs.clientes?r.ucs.clientes.nome:'';return (r.ucs?r.ucs.numero_uc:'')+(c?' - '+c:'');}
function normTxt(t){return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();}
function checklistCiclo(cs,cdocs,comps){
  var itens=[];
  var ger=cdocs.filter(function(d){return d.tipo==='conta_geradora'||d.tipo==='demonstrativo_energisa';});
  var demo=ger.filter(function(d){return d.tipo==='demonstrativo_energisa'||/demonstr/.test(normTxt(d.nome_arquivo));});
  var conta=ger.filter(function(d){return demo.indexOf(d)<0;});
  var gid=S.u.usina.uc_geradora_id||'';
  itens.push({rot:'UC geradora &mdash; conta Energisa',ok:conta.length>0,arq:conta.map(function(d){return d.nome_arquivo;}),uc:gid,tipo:'conta_geradora'});
  itens.push({rot:'UC geradora &mdash; demonstrativo de compensacao',ok:demo.length>0,arq:demo.map(function(d){return d.nome_arquivo;}),uc:gid,tipo:'demonstrativo_energisa'});
  var soltas=cdocs.filter(function(d){return d.tipo==='conta_uc_recebedora'&&!d.uc_id;});
  ucsDoCiclo(cs).forEach(function(r){
    var lig=cdocs.filter(function(d){return d.tipo==='conta_uc_recebedora'&&d.uc_id===r.uc_id;});
    var num=String(r.ucs.numero_uc||'').replace(/\D/g,'');
    var nomeCli=normTxt(r.ucs.clientes?r.ucs.clientes.nome:'');
    var prov=soltas.filter(function(d){
      var n=normTxt(d.nome_arquivo),nd=n.replace(/\D/g,'');
      if(num.length>=6&&nd.indexOf(num.slice(0,7))>-1)return true;
      var base=n.replace(/\.pdf$/,'').replace(/[^a-z0-9]+/g,' ').trim();
      if(base.length>=2&&(' '+nomeCli+' ').indexOf(' '+base+' ')>-1)return true;
      var toks=base.split(' ').filter(function(t){return t.length>=4;});
      return toks.length>0&&toks.every(function(t){return nomeCli.indexOf(t)>-1;});
    });
    var cp=comps.filter(function(x){return x.uc_id===r.uc_id&&x.status==='ok';})[0];
    var ok=lig.length>0||prov.length>0||!!cp;
    var arq=lig.map(function(d){return d.nome_arquivo;}).concat(prov.map(function(d){return d.nome_arquivo+' (provavel)';}));
    if(!ok&&!arq.length&&cp)arq=['apurada'];
    itens.push({rot:'Conta da UC '+esc(ucRot(r))+' <span style="color:var(--muted)">('+Number(r.percentual||0)+'%)</span>',ok:ok,arq:arq,uc:r.uc_id,tipo:'conta_uc_recebedora',apurada:!!cp&&!lig.length&&!prov.length});
  });
  var disp=cs.docs_dispensados||[];
  itens.forEach(function(i){i.chave=(i.tipo==='conta_uc_recebedora'?'uc:'+i.uc:i.tipo);i.disp=!i.ok&&disp.indexOf(i.chave)>-1;});
  var faltam=itens.filter(function(i){return !i.ok&&!i.disp;}).length;
  var h='<div class="panel" style="margin:0 0 16px;padding:14px 16px;border-color:'+(faltam?'var(--warn, #c98a1b)':'var(--ok, #2e7d4f)')+'">';
  h+='<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><h2 style="margin:0">Documentos do ciclo</h2>';
  var nd=itens.filter(function(i){return i.disp;}).length;
  h+=faltam?'<span class="chip warn">Faltam '+faltam+' de '+itens.length+'</span>':'<span class="chip ok">Todos recebidos ('+(itens.length-nd)+(nd?' + '+nd+' dispensado'+(nd>1?'s':''):'')+')</span>';
  h+='</div><div class="tblwrap"><table><tr><th>Documento esperado</th><th>Situacao</th><th>Arquivo</th><th></th></tr>';
  itens.forEach(function(i){
    h+='<tr><td>'+i.rot+'</td><td>'+(i.ok?'<span class="chip ok">Recebido</span>':i.disp?'<span class="chip">Dispensado</span>':'<span class="chip bad">Falta</span>')+'</td>';
    h+='<td style="word-break:break-all;color:var(--muted);font-size:12.5px">'+(i.apurada?'apurada sem arquivo vinculado':i.arq.map(esc).join('<br>'))+'</td>';
    var bt='';
    if(!i.ok&&!i.disp)bt='<button class="btn mini" onclick="A.anexarConta(&quot;'+cs.id+'&quot;,&quot;'+i.uc+'&quot;,&quot;'+i.tipo+'&quot;)">Anexar</button> <button class="btn sec mini" title="Nao sera enviado neste ciclo" onclick="A.dispensarDoc(&quot;'+cs.id+'&quot;,&quot;'+i.chave+'&quot;,true)">Dispensar</button>';
    else if(i.disp)bt='<button class="btn sec mini" onclick="A.dispensarDoc(&quot;'+cs.id+'&quot;,&quot;'+i.chave+'&quot;,false)">Desfazer</button>';
    h+='<td style="white-space:nowrap">'+bt+'</td></tr>';
  });
  h+='</table></div>';
  if(!ucsDoCiclo(cs).length)h+='<p class="note" style="margin-top:8px">Nenhuma UC recebedora com rateio vigente nesta geracao &mdash; confira a aba UCs &amp; Rateio.</p>';
  return h+'</div>';
}

// ---------- CLIENTES ----------
async function loadClientes(){
  var q=await Promise.all([
    sb.from('clientes').select('*, ucs(id,numero_uc)').order('nome'),
    sb.from('investidores').select('*, usinas(nome)').order('nome'),
    sb.from('usinas').select('id,nome,ativo').order('nome'),
    sb.from('rateios').select('usina_id,uc_id,vigencia_fim'),
    sb.from('ucs').select('id,cliente_id')
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  S.cli=q[0].data;S.inv=q[1].data;S.usinas=q[2].data;
  var ucCli={};q[4].data.forEach(function(u){ucCli[u.id]=u.cliente_id;});
  var mapa={};
  q[3].data.forEach(function(r){
    var cid=ucCli[r.uc_id];if(!cid)return;
    if(!mapa[cid])mapa[cid]={};
    if(!mapa[cid][r.usina_id]||!r.vigencia_fim)mapa[cid][r.usina_id]=!r.vigencia_fim;
  });
  S.cliUsinas=mapa;
  renderClientes();
}
function renderClientes(){
  var h='<div class="pagehead"><h1>Clientes & Investidores</h1></div>';
  h+='<div class="tabs"><button class="'+(S.cliTab==='clientes'?'on':'')+'" onclick="A.ctab(&quot;clientes&quot;)">Clientes</button><button class="'+(S.cliTab==='inv'?'on':'')+'" onclick="A.ctab(&quot;inv&quot;)">Investidores</button></div>';
  var unome={};S.usinas.forEach(function(u){unome[u.id]=u.nome;});
  var usinasDoCliente=function(cid){
    var m=(S.cliUsinas||{})[cid]||{};
    return Object.keys(m).map(function(uid){return {id:uid,nome:unome[uid]||'?',ativa:m[uid]};})
      .sort(function(a,b){return a.nome.localeCompare(b.nome);});
  };
  if(S.cliTab==='clientes'){
    if(!S.cliUsinaFiltro)S.cliUsinaFiltro='';
    var lista=S.cli.filter(function(c){
      if(!S.cliUsinaFiltro)return true;
      return !!((S.cliUsinas||{})[c.id]||{})[S.cliUsinaFiltro];
    });
    h+='<div class="actbar"><button class="btn" onclick="A.formCliente()">Novo cliente</button>';
    h+='<div class="fld"><label>Filtrar por usina</label><select id="cli-fu" onchange="A.cliUsina(this.value)"><option value="">Todas as usinas ('+S.cli.length+')</option>';
    S.usinas.forEach(function(u){
      var n=S.cli.filter(function(c){return !!((S.cliUsinas||{})[c.id]||{})[u.id];}).length;
      if(n)h+='<option value="'+u.id+'"'+(S.cliUsinaFiltro===u.id?' selected':'')+'>'+esc(u.nome)+' ('+n+')</option>';
    });
    h+='</select></div>';
    if(S.cliUsinaFiltro)h+='<button class="btn sec" onclick="A.cliUsina(&quot;&quot;)">Limpar filtro</button>';
    h+='</div>';
    h+='<div class="panel">';
    if(!S.cli.length)h+='<p class="empty">Nenhum cliente cadastrado ainda &mdash; serao importados na migracao.</p>';
    else if(!lista.length)h+='<p class="empty">Nenhum cliente nesta usina.</p>';
    else{h+='<div class="tblwrap"><table><tr><th>Cliente</th><th>Usinas</th><th>Grupo</th><th>CNPJ/CPF</th><th>E-mails</th><th class="num">UCs</th><th></th></tr>';
      lista.forEach(function(c){
        var us=usinasDoCliente(c.id);
        h+='<tr><td><b>'+esc(c.nome)+'</b></td>';
        h+='<td>'+(us.length?us.map(function(x){return '<span class="chip'+(x.ativa?' info':'')+'">'+esc(x.nome.replace(/^Usina /,''))+(x.ativa?'':' (encerrada)')+'</span>';}).join(' '):'&mdash;')+'</td>';
        h+='<td>'+esc(c.grupo||'')+'</td><td class="mono">'+esc(c.cnpj_cpf||'')+'</td>';
        h+='<td>'+(c.emails&&c.emails.length?c.emails.map(function(e){return '<a href="mailto:'+esc(e)+'">'+esc(e)+'</a>';}).join('<br>'):'&mdash;')+'</td>';
        h+='<td class="num">'+(c.ucs?c.ucs.length:0)+'</td>';
        h+='<td><button class="btn sec mini" onclick="A.formCliente(&quot;'+c.id+'&quot;)">Editar</button></td></tr>';
      });h+='</table></div>';}
    h+='<p class="note">O envio automatico de relatorios por e-mail (dominio abrapesolar.com.br) entra na proxima etapa da plataforma.</p></div>';
  }else{
    h+='<div class="actbar"><button class="btn" onclick="A.formInv()">Novo investidor</button></div>';
    h+='<div class="panel">';
    if(!S.inv.length)h+='<p class="empty">Nenhum investidor cadastrado ainda.</p>';
    else{h+='<div class="tblwrap"><table><tr><th>Investidor</th><th>Usina</th><th>E-mail</th><th class="num">% contratado</th><th></th></tr>';
      S.inv.forEach(function(v){
        h+='<tr><td><b>'+esc(v.nome)+'</b></td><td>'+esc(v.usinas?v.usinas.nome:'&mdash;')+'</td><td>'+(v.email?'<a href="mailto:'+esc(v.email)+'">'+esc(v.email)+'</a>':'&mdash;')+'</td><td class="num">'+(v.percentual_contratado!==null&&v.percentual_contratado!==undefined?Number(v.percentual_contratado).toLocaleString('pt-BR')+'%':'&mdash;')+'</td>';
        h+='<td><button class="btn sec mini" onclick="A.formInv(&quot;'+v.id+'&quot;)">Editar</button></td></tr>';
      });h+='</table></div>';}
    h+='</div>';
  }
  el('main').innerHTML=h;
}

// ---------- COBRANCA ----------
async function loadCobranca(){
  var q=await Promise.all([
    sb.from('faturas_abrape').select('*, clientes(nome,grupo), ciclos(mes_referencia, usinas(nome))').order('criado_em',{ascending:false}).limit(2000),
    sb.from('boletos').select('*, faturas_abrape(numero,ano,clientes(nome,grupo))').order('criado_em',{ascending:false}).limit(2000)
  ]);
  for(var i=0;i<q.length;i++){if(q[i].error)throw q[i].error;}
  S.cobFat=q[0].data;S.cobBol=q[1].data;
  if(!S.cobAba)S.cobAba='faturas';
  if(!S.cobFiltro)S.cobFiltro='receber';
  if(S.cobCliente===undefined)S.cobCliente='';
  var nomes={};
  S.cobFat.forEach(function(f){if(f.clientes&&f.clientes.nome)nomes[f.clientes.nome]=1;if(f.clientes&&f.clientes.grupo)nomes[f.clientes.grupo]=1;});
  var h='<div class="pagehead"><h1>Central de Cobranca</h1><span class="sub">Faturas ABRAPE e boletos Banco Inter</span></div>';
  h+='<div id="cobKpis"></div>';
  h+='<div class="panel"><div id="cobAbas"></div>';
  h+='<div class="cobbar"><div id="cobStatus"></div>';
  h+='<div class="cobbusca"><input id="cob-cli" type="search" list="cob-clientes" placeholder="Filtrar por cliente ou investidor (ex.: NELFARMA)" value="'+esc(S.cobCliente)+'" autocomplete="off">';
  h+='<datalist id="cob-clientes">'+Object.keys(nomes).sort().map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist>';
  h+='<button class="btn sec mini" id="cob-limpa" onclick="A.cobCliente(&quot;&quot;)"'+(S.cobCliente?'':' hidden')+'>Limpar</button></div></div>';
  h+='<div id="cobCorpo"></div></div>';
  el('main').innerHTML=h;
  el('cob-cli').addEventListener('input',function(){S.cobCliente=this.value;renderCob();});
  renderCob();
}
function renderCob(){
  var hojeISO=new Date().toISOString().slice(0,10);
  var termo=(S.cobCliente||'').trim().toLowerCase();
  var casa=function(cl){if(!termo)return true;if(!cl)return false;return String(cl.nome||'').toLowerCase().indexOf(termo)>-1||String(cl.grupo||'').toLowerCase().indexOf(termo)>-1;};
  var fat=S.cobFat.filter(function(f){return casa(f.clientes);});
  var bol=S.cobBol.filter(function(b){return casa(b.faturas_abrape&&b.faturas_abrape.clientes);});
  var classe=function(f){
    if(f.status==='paga')return 'pagas';
    if(f.status==='cancelada')return 'canceladas';
    if(f.status==='vencida'||(f.vencimento&&f.vencimento<hojeISO))return 'vencidas';
    return 'receber';
  };
  var classeB=function(b){
    if(b.status==='pago')return 'pagas';
    if(b.status==='cancelado')return 'canceladas';
    if(b.status==='vencido'||b.status==='expirado'||(b.vencimento&&b.vencimento<hojeISO))return 'vencidas';
    return 'receber';
  };
  var grupos={receber:[],vencidas:[],canceladas:[],pagas:[]};fat.forEach(function(f){grupos[classe(f)].push(f);});
  var gb={receber:[],vencidas:[],canceladas:[],pagas:[]};bol.forEach(function(b){gb[classeB(b)].push(b);});
  function soma(a){return a.reduce(function(x,f){return x+Number(f.valor||0);},0);}
  var k='';
  if(termo)k+='<p class="note" style="margin:-6px 0 12px">Mostrando apenas: <b>'+esc(S.cobCliente)+'</b></p>';
  k+='<div class="kpis">';
  k+='<div class="kpi"><div class="l">Contas a Receber</div><div class="v">'+money(soma(grupos.receber))+'</div><div class="d">'+grupos.receber.length+' faturas no prazo</div></div>';
  k+='<div class="kpi"'+(grupos.vencidas.length?' style="border-color:var(--bad)"':'')+'><div class="l">Contas Vencidas</div><div class="v">'+money(soma(grupos.vencidas))+'</div><div class="d">'+grupos.vencidas.length+' faturas vencidas</div></div>';
  k+='<div class="kpi"><div class="l">Total a Receber</div><div class="v">'+money(soma(grupos.receber)+soma(grupos.vencidas))+'</div><div class="d">no prazo + vencidas</div></div>';
  k+='<div class="kpi"><div class="l">Pagas</div><div class="v">'+money(soma(grupos.pagas))+'</div><div class="d">'+grupos.pagas.length+' faturas quitadas</div></div>';
  k+='</div>';
  el('cobKpis').innerHTML=k;
  var ehFat=S.cobAba==='faturas';
  var gr=ehFat?grupos:gb;
  var a='<div class="tabs" style="margin-bottom:16px">';
  a+='<button class="'+(ehFat?'on':'')+'" onclick="A.cobAba(&quot;faturas&quot;)">Faturas ABRAPE ('+fat.length+')</button>';
  a+='<button class="'+(ehFat?'':'on')+'" onclick="A.cobAba(&quot;boletos&quot;)">Boletos Banco Inter ('+bol.length+')</button></div>';
  el('cobAbas').innerHTML=a;
  var FILTROS=ehFat
    ?[['receber','A receber'],['vencidas','Vencidas'],['canceladas','Canceladas'],['pagas','Pagas']]
    :[['receber','A receber'],['vencidas','Vencidos'],['canceladas','Cancelados'],['pagas','Pagos']];
  var s='<div class="switch" style="margin:0">';
  FILTROS.forEach(function(ft){s+='<button class="'+(S.cobFiltro===ft[0]?'on':'')+'" onclick="A.cobFiltro(&quot;'+ft[0]+'&quot;)">'+ft[1]+' ('+gr[ft[0]].length+')</button>';});
  el('cobStatus').innerHTML=s+'</div>';
  var lb=el('cob-limpa');if(lb)lb.hidden=!termo;
  var lista=(gr[S.cobFiltro]||[]).slice().sort(function(a,b){return String(a.vencimento||'').localeCompare(String(b.vencimento||''));});
  var h='';
  if(ehFat){
    if(!lista.length)h+='<p class="empty">Nenhuma fatura neste filtro.</p>';
    else{h+='<div class="tblwrap"><table><tr><th>Fatura</th><th>Usina</th><th>Ciclo</th><th>Cliente</th><th class="num">Valor</th><th>Venc.</th><th>Status</th></tr>';
      lista.forEach(function(f){
        h+='<tr><td><b>'+(f.numero?f.numero+'/'+f.ano:'s/n')+'</b></td><td>'+esc(f.ciclos&&f.ciclos.usinas?f.ciclos.usinas.nome:'&mdash;')+'</td><td>'+(f.ciclos?mesLbl(f.ciclos.mes_referencia):'&mdash;')+'</td><td>'+esc(f.clientes?f.clientes.nome:'&mdash;')+'</td><td class="num">'+money(f.valor)+'</td><td>'+dt(f.vencimento)+'</td><td>'+(classe(f)==='vencidas'?'<span class="chip bad">Vencida</span>':chip(STFAT,f.status))+'</td></tr>';
      });
      h+='<tr><td colspan="4" style="text-align:right;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase">Total ('+lista.length+')</td><td class="num"><b>'+money(soma(lista))+'</b></td><td colspan="2"></td></tr>';
      h+='</table></div>';}
  } else {
    if(!lista.length)h+='<p class="empty">Nenhum boleto neste filtro.</p>';
    else{h+='<div class="tblwrap"><table><tr><th>Nosso numero</th><th>Fatura</th><th>Cliente</th><th class="num">Valor</th><th>Venc.</th><th>Status</th><th class="num">Recebido</th></tr>';
      lista.forEach(function(b){
        var fb=b.faturas_abrape;
        h+='<tr><td class="mono">'+esc(b.nosso_numero||'')+'</td><td>'+(fb?(fb.numero?fb.numero+'/'+fb.ano:'s/n'):'&mdash;')+'</td><td>'+esc(fb&&fb.clientes?fb.clientes.nome:'&mdash;')+'</td><td class="num">'+money(b.valor)+'</td><td>'+dt(b.vencimento)+'</td><td>'+(classeB(b)==='vencidas'&&b.status==='aberto'?'<span class="chip bad">Vencido</span>':chip(STBOL,b.status))+'</td><td class="num">'+money(b.valor_recebido)+'</td></tr>';
      });
      var rec=lista.reduce(function(x,b){return x+Number(b.valor_recebido||0);},0);
      h+='<tr><td colspan="3" style="text-align:right;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase">Total ('+lista.length+')</td><td class="num"><b>'+money(soma(lista))+'</b></td><td colspan="2"></td><td class="num"><b>'+(rec?money(rec):'&mdash;')+'</b></td></tr>';
      h+='</table></div>';}
  }
  el('cobCorpo').innerHTML=h;
}

        nome:val('ed-nome'),modelo:val('ed-modelo'),distribuidora:val('ed-dist'),cidade:val('ed-cidade')||null,uf:val('ed-uf')||null,
        potencia_kwp:val('ed-pot')||null,num_modulos:val('ed-mod')||null,inversores:val('ed-inv')||null,titularidade:val('ed-tit')||null,
        tem_investidor:val('ed-invst')==='s',ativo:val('ed-ativo')==='s',observacoes:val('ed-obs')||null
      }).eq('id',S.usinaId);
      if(r.error)throw r.error;toast('Cadastro salvo.');loadUsina().catch(fail);
    }catch(e){fail(e);}
  },
  achaOuCriaUC:async function(numero,extras){
    var f=await sb.from('ucs').select('id').eq('numero_uc',numero);
    if(f.error)throw f.error;
    if(f.data.length)return f.data[0].id;
    var body={numero_uc:numero,tipo:extras.tipo||'recebedora'};
    if(extras.cliente_id)body.cliente_id=extras.cliente_id;
    if(extras.cidade)body.cidade=extras.cidade;
    if(extras.multi_fonte)body.multi_fonte=true;
    var i=await sb.from('ucs').insert(body).select('id').single();
    if(i.error)throw i.error;
    return i.data.id;
  },
  vincularUC:async function(){
    try{
      var num=val('vu-num');if(!num)throw new Error('Informe o numero da UC.');
      var pct=val('vu-pct');if(!pct)throw new Error('Informe o percentual de rateio.');
      var vig=val('vu-vig');if(!vig)throw new Error('Informe o inicio da vigencia.');
      var ucId=await A.achaOuCriaUC(num,{tipo:'recebedora',cliente_id:val('vu-cli')||null,cidade:val('vu-cidade'),multi_fonte:val('vu-multi')==='s'});
      var r=await sb.from('rateios').insert({usina_id:S.usinaId,uc_id:ucId,percentual:pct,vigencia_inicio:vig});
      if(r.error)throw r.error;
      var mo=val('vu-modelo');
      if(mo){
        var body={usina_id:S.usinaId,uc_id:ucId,modelo:mo,vigencia_inicio:vig};
        if(mo==='desconto')body.percentual_desconto=val('vu-valor')||null;else body.tarifa_fixa=val('vu-valor')||null;
        var c=await sb.from('condicoes_comerciais').insert(body);if(c.error)throw c.error;
      }
      toast('UC vinculada.');loadUsina().catch(fail);
    }catch(e){fail(e);}
  },
  encerrarRateio:async function(id,ucId){
    if(!window.confirm('Encerrar a vigencia deste vinculo de rateio a partir de hoje? O historico (compensacoes, faturas) e mantido e a UC passa a aparecer como Encerrado.'))return;
    try{
      var hoje=new Date().toISOString().slice(0,10);
      var r=await sb.from('rateios').update({vigencia_fim:hoje}).eq('id',id);if(r.error)throw r.error;
      var c=await sb.from('condicoes_comerciais').update({vigencia_fim:hoje}).eq('usina_id',S.usinaId).eq('uc_id',ucId).is('vigencia_fim',null);if(c.error)throw c.error;
      toast('Vinculo encerrado (historico mantido).');loadUsina().catch(fail);
    }catch(e){fail(e);}
  },
  setGeradora:async function(){
    try{
      var num=val('ug-num');if(!num)throw new Error('Informe o numero da UC geradora.');
      var ucId=await A.achaOuCriaUC(num,{tipo:'geradora'});
      var r=await sb.from('usinas').update({uc_geradora_id:ucId}).eq('id',S.usinaId);
      if(r.error)throw r.error;toast('UC geradora definida.');loadUsina().catch(fail);
    }catch(e){fail(e);}
  },
  uploadDoc:async function(){
    try{
      var inp=el('up-file');
      if(!inp.files.length)throw new Error('Escolha pelo menos um arquivo.');
      var cicloId=val('up-ciclo')||null,tipo=val('up-tipo');
      var cic=S.u.ciclos.filter(function(c){return c.id===cicloId;})[0];
      var pasta=cic?String(cic.mes_referencia).slice(0,7):'geral';
      for(var i=0;i<inp.files.length;i++){
        var f=inp.files[i];
        var nome=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]/g,'_');
        var path=S.usinaId+'/'+pasta+'/'+Date.now()+'_'+nome;
        var up=await sb.storage.from('documentos').upload(path,f);
        if(up.error)throw up.error;
        var r=await sb.from('documentos').insert({usina_id:S.usinaId,ciclo_id:cicloId,tipo:tipo,storage_path:path,nome_arquivo:f.name,mime_type:f.type,tamanho_bytes:f.size,enviado_por:S.perfil.email});
        if(r.error)throw r.error;
      }
      toast(inp.files.length+' arquivo(s) enviado(s).');loadUsina().catch(fail);
    }catch(e){fail(e);}
  },
  abrirDoc:async function(path){
    try{
      var r=await sb.storage.from('documentos').createSignedUrl(path,3600);
      if(r.error)throw r.error;
      window.open(r.data.signedUrl,'_blank');
    }catch(e){fail(e);}
  },
  delDoc:async function(id,path){
    if(!window.confirm('Excluir este documento do banco e do arquivo? Essa acao nao tem volta.'))return;
    try{
      var s=await sb.storage.from('documentos').remove([path]);if(s.error)throw s.error;
      var r=await sb.from('documentos').delete().eq('id',id);if(r.error)throw r.error;
      toast('Documento excluido.');loadUsina().catch(fail);
    }catch(e){fail(e);}
  },
  formCliente:function(id){
    var c=id?S.cli.filter(function(x){return x.id===id;})[0]:{};
    var h='<h2>'+(id?'Editar cliente':'Novo cliente')+'</h2><div class="frm">';
    h+='<div class="fld full"><label>Nome / Razao social</label><input id="cl-nome" value="'+esc(c.nome||'')+'"></div>';
    h+='<div class="fld"><label>CNPJ / CPF</label><input id="cl-doc" value="'+esc(c.cnpj_cpf||'')+'"></div>';
    h+='<div class="fld"><label>Grupo</label><input id="cl-grupo" value="'+esc(c.grupo||'')+'" placeholder="ex.: NELFARMA"></div>';
    h+='<div class="fld full"><label>E-mails (separados por virgula)</label><input id="cl-emails" value="'+esc((c.emails||[]).join(', '))+'"></div>';
    h+='<div class="fld"><label>Telefone</label><input id="cl-tel" value="'+esc(c.telefone||'')+'"></div>';
    h+='<div class="fld"><label>Cidade</label><input id="cl-cidade" value="'+esc(c.cidade||'')+'"></div>';
    h+='<div class="fld"><label>UF</label><input id="cl-uf" value="'+esc(c.uf||'')+'"></div>';
    h+='<div class="fld full"><label>Endereco</label><input id="cl-end" value="'+esc(c.endereco||'')+'"></div>';
    h+='<div class="fld full"><label>Observacoes</label><textarea id="cl-obs">'+esc(c.observacoes||'')+'</textarea></div>';
    h+='</div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="A.salvarCliente('+(id?'&quot;'+id+'&quot;':'null')+')">Salvar</button><button class="btn sec" onclick="A.closeModal()">Cancelar</button></div>';
    A.modal(h);
  },
  salvarCliente:async function(id){
    try{
      var body={nome:val('cl-nome'),cnpj_cpf:val('cl-doc')||null,grupo:val('cl-grupo')||null,
        emails:val('cl-emails')?val('cl-emails').split(',').map(function(e){return e.trim();}).filter(Boolean):[],
        telefone:val('cl-tel')||null,cidade:val('cl-cidade')||null,uf:val('cl-uf')||null,endereco:val('cl-end')||null,observacoes:val('cl-obs')||null};
      if(!body.nome)throw new Error('Informe o nome.');
      var r=id?await sb.from('clientes').update(body).eq('id',id):await sb.from('clientes').insert(body);
      if(r.error)throw r.error;
      A.closeModal();toast('Cliente salvo.');loadClientes().catch(fail);
    }catch(e){fail(e);}
  },
  formInv:function(id){
    var v=id?S.inv.filter(function(x){return x.id===id;})[0]:{};
    var h='<h2>'+(id?'Editar investidor':'Novo investidor')+'</h2><div class="frm">';
    h+='<div class="fld full"><label>Nome</label><input id="iv-nome" value="'+esc(v.nome||'')+'"></div>';
    h+='<div class="fld"><label>CNPJ / CPF</label><input id="iv-doc" value="'+esc(v.cnpj_cpf||'')+'"></div>';
    h+='<div class="fld"><label>E-mail</label><input id="iv-email" value="'+esc(v.email||'')+'"></div>';
    h+='<div class="fld"><label>Telefone</label><input id="iv-tel" value="'+esc(v.telefone||'')+'"></div>';
    h+='<div class="fld"><label>Usina</label><select id="iv-usina"><option value="">&mdash;</option>';
    S.usinas.forEach(function(u){h+='<option value="'+u.id+'"'+(v.usina_id===u.id?' selected':'')+'>'+esc(u.nome)+'</option>';});
    h+='</select></div>';
    h+='<div class="fld"><label>% contratado</label><input id="iv-pct" type="number" step="0.01" value="'+(v.percentual_contratado!==null&&v.percentual_contratado!==undefined?v.percentual_contratado:'')+'"></div>';
    h+='<div class="fld full"><label>Observacoes</label><textarea id="iv-obs">'+esc(v.observacoes||'')+'</textarea></div>';
    h+='</div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn" onclick="A.salvarInv('+(id?'&quot;'+id+'&quot;':'null')+')">Salvar</button><button class="btn sec" onclick="A.closeModal()">Cancelar</button></div>';
    A.modal(h);
  },
  salvarInv:async function(id){
    try{
      var body={nome:val('iv-nome'),cnpj_cpf:val('iv-doc')||null,email:val('iv-email')||null,telefone:val('iv-tel')||null,usina_id:val('iv-usina')||null,percentual_contratado:val('iv-pct')||null,observacoes:val('iv-obs')||null};
      if(!body.nome)throw new Error('Informe o nome.');
      var r=id?await sb.from('investidores').update(body).eq('id',id):await sb.from('investidores').insert(body);
      if(r.error)throw r.error;
      A.closeModal();toast('Investidor salvo.');loadClientes().catch(fail);
    }catch(e){fail(e);}
  },
  addUsuario:async function(){
    try{
      var r=await sb.from('usuarios_autorizados').insert({email:val('nu-email').toLowerCase(),nome:val('nu-nome'),papel:val('nu-papel')});
      if(r.error)throw r.error;toast('Usuario autorizado.');loadAdmin().catch(fail);
    }catch(e){fail(e);}
  },
  modal:function(html){
    var bg=document.createElement('div');bg.id='modalbg';
    bg.innerHTML='<div id="modal">'+html+'</div>';
    bg.addEventListener('click',function(ev){if(ev.target===bg)A.closeModal();});
    document.body.appendChild(bg);
  },
  closeModal:function(){var m=el('modalbg');if(m)m.remove();}
};
window.go=go;

sb.auth.onAuthStateChange(function(ev,session){
  if(ev==='SIGNED_IN'&&!S.perfil)enter().catch(fail);
  if(ev==='SIGNED_OUT'){S.perfil=null;showLogin();}
});
sb.auth.getSession().then(function(r){
  if(r.data&&r.data.session)enter().catch(fail);else showLogin();
});
</script>
</body>
</html>
